# 测试环境配置：覆盖主配置中的安全设置，提供集成测试所需的 JWT 密钥和用户
# 生产环境不应使用这些值

# JWT 签名密钥（测试专用，满足 HS256 回退模式所需的最小 32 字节）
aerofleet.security.jwt-secret=test-secret-for-integration-tests-at-least-32-chars

# 内置测试用户
aerofleet.security.users=admin:admin

# 使用 HS256 简化测试（避免 RSA 密钥配置）
jwt.algorithm=HS256
jwt.generate-keys=false