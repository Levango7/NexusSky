# ============================================================
# 开发环境 profile (dev)
# 激活方式：--spring.profiles.active=dev （默认）
# ============================================================

# ===== 安全认证 =====
# 开发模式：允许所有请求，不强制 JWT 认证
aerofleet.security.dev-mode=true
# License 拦截器：开发环境跳过校验
aerofleet.license.enabled=false
# CORS 允许的源：Vite dev server + localhost
aerofleet.security.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
# JWT：开发环境自动生成 RSA 密钥对（JwtTokenProvider 内置，prod profile 禁止；
# 不配置时 RS256 回退 HS256 会因密钥为空直接启动失败）
jwt.generate-keys=true

# ===== 凭据加密 =====
# base 不再提供明文默认值（2026-10-01），开发用密钥显式写在这里。
# 生产/预发布走 ${AEROFLEET_ENCRYPTION_KEY}，未设即启动失败。
aerofleet.encryption.key=aerofleet-dev-encryption-key

# ===== H2 内存数据库 =====
spring.datasource.url=jdbc:h2:file:./data/aerofleet;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# ===== Redis：开发环境禁用 =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 上面说了“禁用”，但 health 指针并不看这句话：Spring Boot 只要存在
# RedisConnectionFactory 就会自动注册 RedisHealthIndicator，所以本地没起 redis 时
# /actuator/health 永远是 DOWN。后果：任何以 health==UP 为门禁的本地流程
# （启动等待、e2e 脚本、本机验证）都会卡住。
# dev 不用 redis，就不应该因 redis 而不健康。
management.health.redis.enabled=false

# ===== 缓存：开发环境使用 Simple（无 Redis） =====
spring.cache.type=simple

# ===== 日志级别：DEBUG =====
logging.level.root=INFO
logging.level.io.aerofleet=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== Swagger UI：启用 =====
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ===== Actuator：开发环境显示完整健康详情 =====
management.endpoint.health.show-details=always
# ===== UDP 网关安全（P1-3） =====
# 开发环境：禁用设备白名单，接受所有 sysid（保持开发便利性）
aerofleet.udp.device-whitelist-enabled=false
# 单 sysid 每秒最大帧数（开发环境保持默认）
aerofleet.udp.max-frame-rate-per-sysid=100
# 网卡绑定地址：开发环境绑定所有网卡
aerofleet.udp.bind-address=0.0.0.0
# ===== MAVLink v2 链路签名（C5）=====
# 默认关闭。签名为机队范围的行为变更（MAVLink 签名块无 key id，打开即硬切换、无宽限期）。
# 打开前请读 application-prod.properties 里同名的完整说明，或见 docs 中 C5 条目。
mavlink.signing.enabled=false
mavlink.signing.reject-unsigned=true

