# ============================================================
# 测试环境 profile (test)
# 激活方式：--spring.profiles.active=test
# 使用 H2 内存数据库，禁用 Redis/缓存，确保测试隔离
# ============================================================

# ===== 安全认证：测试环境宽松 =====
aerofleet.security.dev-mode=true
aerofleet.license.enabled=false
aerofleet.security.rbac-enabled=false
aerofleet.security.allowed-origins=http://localhost:5173
aerofleet.security.users=admin:admin
aerofleet.encryption.key=test-encryption-key-for-integration-tests

# ===== H2 内存数据库（测试专用） =====
spring.datasource.url=jdbc:h2:mem:aerofleet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== Flyway：测试环境禁用（使用 Hibernate ddl-auto=create-drop） =====
spring.flyway.enabled=false

# ===== Redis：测试环境禁用 =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== 缓存：测试环境使用 Simple（无 Redis） =====
spring.cache.type=simple

# ===== 日志级别：WARN（减少测试噪音） =====
logging.level.root=WARN
logging.level.io.aerofleet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== Swagger UI：禁用 =====
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== Actuator =====
management.endpoint.health.show-details=always