# ============================================================
# 生产环境 profile (prod)
# 激活方式：--spring.profiles.active=prod
# ============================================================

# ===== 安全认证 =====
# 生产模式：启用 JWT 认证
aerofleet.security.dev-mode=false
# 默认忽略 X-Forwarded-For，以直连地址进行登录限流。
# 仅当后端只允许可信代理访问，且代理覆盖客户端传入的转发头时，才可设为 true。
aerofleet.security.trust-forwarded-for=false
# License 拦截器：生产环境启用校验
aerofleet.license.enabled=true
# RBAC 基于角色的访问控制：生产环境启用
aerofleet.security.rbac-enabled=true
# JWT 密钥：必须通过环境变量 AEROFLEET_JWT_SECRET 设置，无默认值（不设置则启动失败）
aerofleet.security.jwt-secret=${AEROFLEET_JWT_SECRET}
# 用户凭证：必须通过环境变量 AEROFLEET_USERS 设置（格式 username:password）
aerofleet.security.users=${AEROFLEET_USERS}
# CORS 允许的源：限制到生产域名
aerofleet.security.allowed-origins=https://aerofleet.io,https://gcs.aerofleet.io,https://admin.aerofleet.io

# ===== PostgreSQL 数据库（占位配置，通过环境变量覆盖） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== Redis：生产环境启用 =====
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=0
# Lettuce 连接池
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=5s

# ===== 缓存：生产环境使用 Redis =====
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=aerofleet::
spring.cache.redis.time-to-live=30m

# ===== 日志级别：WARN =====
logging.level.root=WARN
logging.level.io.aerofleet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== OpenAPI 文档 =====
# Swagger UI 在 prod 环境禁用（不暴露交互式文档界面）
springdoc.swagger-ui.enabled=false
# api-docs 启用：自定义导出端点（/api/v1/openapi/json|yaml）需要 OpenAPIService 运行
# 内置 /v3/api-docs 端点仍受 SecurityConfig 保护（需认证）
springdoc.api-docs.enabled=true

# ===== Actuator：生产环境限制健康详情 =====
management.endpoint.health.show-details=when-authorized

# ===== 审计日志：启用 =====
aerofleet.audit.enabled=true
aerofleet.audit.log-dir=./audit-logs
# ===== UDP 网关安全（P1-3） =====
# 生产环境：启用设备白名单，只接受已注册 sysid 的 MAVLink 帧
aerofleet.udp.device-whitelist-enabled=true
# 单 sysid 每秒最大帧数
aerofleet.udp.max-frame-rate-per-sysid=100
# 网卡绑定地址：生产环境应绑定内网网卡（通过环境变量覆盖）
aerofleet.udp.bind-address=${AEROFLEET_UDP_BIND_ADDRESS:0.0.0.0}