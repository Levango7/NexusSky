# ============================================================
# 生产环境 profile (prod)
# 激活方式：--spring.profiles.active=prod
# ============================================================

# ===== 安全认证 =====
# 生产模式：启用 JWT 认证
aerofleet.security.dev-mode=false
# 默认忽略 X-Forwarded-For，以直连地址进行登录限流。
# 仅当后端只允许可信代理访问，且代理覆盖客户端传入的转发头时，才可设为 true。
aerofleet.security.trust-forwarded-for=false
# License 拦截器：生产环境启用校验
aerofleet.license.enabled=true
# RBAC 基于角色的访问控制：生产环境启用
aerofleet.security.rbac-enabled=true
# JWT 密钥：必须通过环境变量 AEROFLEET_JWT_SECRET 设置，无默认值（不设置则启动失败）
aerofleet.security.jwt-secret=${AEROFLEET_JWT_SECRET}
# 用户凭证：必须通过环境变量 AEROFLEET_USERS 设置（格式 username:password）
aerofleet.security.users=${AEROFLEET_USERS}
# CORS 允许的源：限制到生产域名
aerofleet.security.allowed-origins=https://aerofleet.io,https://gcs.aerofleet.io,https://admin.aerofleet.io

# ===== PostgreSQL 数据库（占位配置，通过环境变量覆盖） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== 日志级别：WARN =====
logging.level.root=WARN
logging.level.io.aerofleet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== Swagger UI：禁用 =====
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== Actuator：生产环境限制健康详情 =====
management.endpoint.health.show-details=when-authorized

# ===== 审计日志：启用 =====
aerofleet.audit.enabled=true
aerofleet.audit.log-dir=./audit-logs