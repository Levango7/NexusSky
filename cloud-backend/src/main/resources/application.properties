# AeroFleet cloud backend — 通用配置（环境特定配置见 application-{dev,staging,prod}.properties）
spring.application.name=aerofleet-cloud

# 激活的环境（默认 prod=PostgreSQL；开发用 --spring.profiles.active=dev；测试用 --spring.profiles.active=test）
spring.profiles.active=prod

# HTTP REST port (Vite dev server proxies /api and /ws here)
server.port=8080

# MAVLink UDP gateway port (GCS convention: 14550; drone side binds 14540)
aerofleet.udp-port=14550

# UDP 网关安全配置（P1-3）
# 网卡绑定地址（0.0.0.0=所有网卡；生产环境应绑定内网网卡）
aerofleet.udp.bind-address=0.0.0.0
# 设备白名单：true=只接受已注册 sysid 的帧（prod 默认）；false=接受所有 sysid（dev 默认）
aerofleet.udp.device-whitelist-enabled=false
# 单 sysid 每秒最大帧数（滑动窗口频率限制，超限丢弃并记 WARN）
aerofleet.udp.max-frame-rate-per-sysid=100
# 关键帧独立预算（P2-F5）：ACK/心跳/任务协议回执/STATUSTEXT 不占主窗口，走这条独立配额——
# 否则高码率流（SITL 4MB/s、真机遥测突发/日志下载同理）会把主窗口在每秒开头吃满，
# 关键帧成批被丢（SITL 实测单轮 340k+ 条丢帧、MISSION_ACK 全灭、上传必现超时）。
# 默认 50/s；<=0 关闭豁免（关键帧退回主窗口，旧行为）。
aerofleet.udp.max-critical-frame-rate-per-sysid=50

# Behind-link-sim drone path: discovery heartbeat goes to the LTE proxy (14600), which forwards to the drone segment
aerofleet.drone-port=14540
# Extra simulated drones to discover (fault rig 14541, vision rig 14542, RF rig 14543), comma-joined
aerofleet.drone-extra-ports=14541,14542,14543

# A drone is considered offline after this many seconds without a HEARTBEAT
aerofleet.heartbeat-timeout-seconds=10

# Flight log persistence (JSON Lines, one file per UTC day under this dir)
aerofleet.flightlog.dir=./flight-logs
aerofleet.flightlog.track-interval-ms=1000
# 是否将飞行日志持久化到数据库（false=仅 JSONL 文件，true=优先 DB 写入失败回退 JSONL）
aerofleet.flightlog.persist-to-db=false
# 入库写不在调用线程上执行，而是进这条有界队列，由一个专用 writer 线程成批落库
# （详见 BatchedWriteQueue）。之所以必须异步：告警经 AlertBus 同步派发，起点是
# mavlink-udp-* 那条单线程 UDP 接收循环；遥测行来自 @Scheduled 的单线程调度池。
# 队列满或落库失败都就地回退 JSONL——不阻塞生产者，也不丢账。
aerofleet.flightlog.write-queue-capacity=20000
aerofleet.flightlog.write-batch-size=50
aerofleet.flightlog.write-flush-ms=200
# 保留天数：每天 03:30 由 FlightLogRetentionJob 删除更早的数据——DB 行按精确时刻，
# JSONL 文件按文件名日期整天删（一天的事件在同一文件里，无法部分删除）。<=0 关闭清理。
aerofleet.flightlog.retention-days=30

# ===== 安全认证（通用默认，生产环境应通过环境变量覆盖） =====
# JWT HS256 回退签名密钥，同时兼作 license 激活码的 HMAC 密钥（HMAC-SHA256，至少 32 字符；
# 生产环境必须通过环境变量配置——非 dev 模式下留空或等于内置默认值会拒绝启动，见 LicenseService 构造器）
aerofleet.security.jwt-secret=
# JWT 有效期（秒）
aerofleet.security.jwt-expiry=3600

# ===== JWT 签名算法配置（P2-2 RS256 非对称签名升级） =====
# 签名算法：RS256（默认，非对称签名）或 HS256（对称签名回退）
jwt.algorithm=RS256
# RSA 私钥（PEM 格式 Base64 编码，用于签发 token；生产环境必须配置）
jwt.private-key=
# RSA 公钥（PEM 格式 Base64 编码，用于验证 token；生产环境必须配置）
jwt.public-key=
# HMAC 密钥（兼容旧配置，当 algorithm=HS256 或 RS256 回退时使用）
jwt.secret=
# 开发环境自动生成 RSA 密钥对（仅适用于开发，生产环境必须设为 false 并配置正式密钥）
jwt.generate-keys=false
# 内置用户（格式 username:password,username2:password2，生产环境应使用外部 IDP）
# 默认为空，开发环境通过环境变量 AEROFLEET_USERS=admin:admin 配置
aerofleet.security.users=
# RBAC 开关：默认开（安全默认——不该依赖"某个 profile 记得打开了它"）。
# 判定顺序见 RoleInterceptor.preHandle：dev-mode=true 或本键为 false 时整体旁路；
# 否则端点必须声明 @RequireRole（方法级优先，可回退类级）或 @PermitAll，两者都没有即 403。
# 旧行为"无注解即放行"已于 2026-10-01 翻转为默认拒绝；角色层级向上满足
# （ADMIN 可满足 OPERATOR/OBSERVER）。覆盖率由 RbacEndpointCoverageTest 逐端点校验。
# dev profile 靠 dev-mode=true 旁路；test profile 显式 false，故单测行为不变。
aerofleet.security.rbac-enabled=true
# 设备/边缘摄取通道的共享 API Key，对应四条 OPERATOR 档写端点：
# POST /api/v1/edge/results、/loRa/alarm、/offline-alarm/batch-upload|flush、/alarms/events。
# 空=完全不介入（出厂行为不变）。非空则由 DeviceIngestKeyBootstrapRunner 在启动时按固定
# keyId=device-ingest 创建/覆写一条 api_keys 记录（库里只存 SHA-256 哈希；长度 <16 拒绝引导）。
# 轮换方式=改本键或对应环境变量后重启。注意这是共享静态密钥，不是每机一密钥。
aerofleet.security.device-ingest-api-key=
aerofleet.security.device-ingest-tenant-id=1

# ===== DeviceRegistry 持久化 =====
# false=纯内存（默认，向后兼容）；true=持久化到 H2/JPA
aerofleet.device-registry.persist=false

# ===== 定时任务调度器 =====
# Boot 默认调度池只有 1 个线程：任何一个 @Scheduled 任务卡住（等一架不回应答的飞机的
# MAVLink 往返就是典型——命令重试要等好几秒），同周期的其他定时任务全部停摆。
# 2026-10-13 e2e-rid 实测到这条饿死链：一条恢复出来的历史编队让 FormationKeeper 反复
# 重发 DO_REPOSITION，调度线程被占 6 秒，RidStateManager 的超时检测整个没跑，
# BROADCASTING_ERROR 断言随之失败。池子给够，单点卡住不再连坐。
spring.task.scheduling.pool.size=8

# ===== JPA 通用配置 =====
spring.jpa.hibernate.ddl-auto=validate
# insert/update 批处理。注意 batch_size 只对**非 IDENTITY 主键**的实体生效——本仓的表几乎
# 都是 IDENTITY（flight_log / audit_log / geofence_breach_event / orch_* 等），加了也不会批。
# flight_log 的高频写不靠这里：它由 BatchedWriteQueue + JdbcTemplate.batchUpdate 显式多行插入
# （曾改序列以启用 Hibernate 批处理，但 prod 的 ddl-auto=validate 会把该序列判成 missing，
# 因为这个名字正是 PG 给 identity 列的内部序列名——见 CHANGELOG 2026-10-01 那一条）。
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== 数据源默认配置（prod: PostgreSQL） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== Flyway 数据库迁移 =====
# 对已有 schema 建立基线（dev 的 H2 文件库已有 Hibernate 创建的表）
spring.flyway.baseline-on-migrate=true

# ===== Redis 默认配置（prod 启用） =====
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=0
# Lettuce 连接池
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=5s

# ===== 缓存默认配置（prod: Redis） =====
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=aerofleet::
# 默认 TTL 30 分钟
spring.cache.redis.time-to-live=30m

# ===== 可观测性：Actuator + Prometheus =====
# 暴露 health/info/metrics/prometheus 端点
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 启用 Prometheus 指标导出
management.metrics.export.prometheus.enabled=true
# 指标标签通用前缀
management.metrics.tags.application=aerofleet-cloud

# ===== OpenAPI 文档 =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=io.aerofleet.cloud.api,io.aerofleet.cloud.mission,io.aerofleet.cloud.vision,io.aerofleet.cloud.telemetry
springdoc.paths-to-match=/api/v1/**

# ===== License 授权 =====
# License key（Base64 编码，未配置时为开发版）
aerofleet.license.key=
# License RSA 公钥（Base64 X.509 格式，未配置时开发模式自动生成密钥对）
# 生产环境必须配置：使用 LicenseKeyGenerator 生成密钥对，公钥配置于此，私钥由签发方安全保管
aerofleet.license.public-key=
# 档位→模块绑定是否在**验证期**强制：License 的模块集合必须恰好等于某个可售档位
# （基础版 core+fleet / 应急版 +emergency / 完整版 +network+advanced），
# 否则 validateLicense 直接判 false —— 这是"三档定价在技术上可执行"的代码保证。
# 默认 true（fail-closed）。改成 false 会退回"签名里写了什么模块就放行什么模块"，
# 且启动时打 WARN；只在确有非档位商务组合时使用。
# 由 LicenseTierBindingEnforcementTest 守卫（含超集必须判红、逃生阀必须可用）。
aerofleet.license.enforce-tier-binding=true

# ===== WebSocket 连接数限制 =====
# 单 IP 最大 WS 连接数
aerofleet.ws.max-connections-per-ip=10
# 单租户最大 WS 连接数
aerofleet.ws.max-connections-per-tenant=20

# ===== WebSocket 慢客户端防护（见 GAPS §十五）=====
# 单帧推送发送时限（毫秒）：客户端连上但不读/慢读数据时写阻塞超过此值即主动断开
aerofleet.ws.send-time-limit-ms=5000
# 单连接发送缓冲上限（字节）：客户端消费慢、缓冲堆积超过此值即断开（默认 512KB）
aerofleet.ws.buffer-size-limit=524288

# ===== 多租户隔离 =====
# 每租户每分钟 API 调用上限
aerofleet.tenant.rate-limit=100

# ===== API 版本 =====
aerofleet.api.version=v1

# ===== 审计日志（默认关闭，生产环境在 application-prod.properties 中启用） =====
aerofleet.audit.enabled=false
# 落库开关：true 时审计写入 audit_log 表（V21，含哈希链；需库可用），
# false 时纯内存缓冲（默认，测试与开发行为不变）。
aerofleet.audit.persist-to-db=false
# 保留天数：>0 时每天 03:45 由 AuditRetentionJob 删除更早的历史行。删除只切哈希链的
# 前缀（链尾照常续接），此后 /api/v1/audit/verify 报 truncated=true——前缀不再可验。
# 默认 0=永久保留：删审计记录属合规决策，不由代码默认替运维做。
aerofleet.audit.retention-days=0

# ===== 只增表留存（五表；默认全部 0=关闭——删数据是运维/合规决策，不由代码替它做） =====
# 每张表一个任务、15 分钟一档错开（Boot 默认调度器单线程）：
#   02:00 越界事件  02:15 出警历史  02:30 配送任务  02:45 应急编排  03:00 维护记录
# 判据：越界/出警按事件自身时刻（非空列）；配送按 coalesce(created_at, start_time)；
# 应急编排按 updated_at（活文档按最后触碰）；维护按 created_at。
# 建议开启值（运营拍板后开）：越界 365 / 出警 365 / 配送 180 / 应急编排 365 / 维护 1095。
aerofleet.geofence.breach-retention-days=0
aerofleet.autodispatch.retention-days=0
aerofleet.delivery.retention-days=0
aerofleet.emergency-orch.retention-days=0
aerofleet.maintenance.retention-days=0
# ===== 凭据加密（SurveillanceDeviceEntity password + webhook secret，AES-GCM） =====
# ⚠️ 2026-10-01：base **不再提供明文默认值**。此前这里硬编码
# `aerofleet-dev-encryption-key`，而 prod/staging profile 都没有覆盖它 ——
# 于是生产环境默认用一把**写在公开仓库里**的密钥加密安防设备口令与 webhook 密钥，
# 且 `PasswordConverter#deriveKey` 的「空值则抛异常」检查因为拿到的不是空值而从不触发。
# 现在 base 留空，各 profile 各自负责：
#   - dev   → 用开发密钥（见 application-dev.properties）
#   - test  → 用测试密钥（见 application-test.properties:13）
#   - prod/staging → `${AEROFLEET_ENCRYPTION_KEY}` 无默认值，未设即启动失败
#     （与 aerofleet.security.jwt-secret 同一套 fail-fast 口径）
aerofleet.encryption.key=${AEROFLEET_ENCRYPTION_KEY:}
# ===== 插件配置（P1-5 SPI 框架）—— 假开关已删（2026-10-30），框架空壳也已删 =====
# 这里原先声明的 8 个 aerofleet.plugins.{category}.{type}.enabled=true **改了不生效**：
# 唯一的读者 spi/PluginConfig 在全仓零注入点，四个插件接口 PayloadPlugin / TransportPlugin /
# RoutePlannerPlugin / DecisionStrategyPlugin 没有任何实现类，PluginRegistry 构造时拿到空列表。
# 键先删（同批，审计 §11.2）；框架本体 spi/ 包 13 个文件 / 1266 行随后也删掉了（owner 裁决"删空壳"）：
# 它承诺的四种能力其实都已在 drone-sim 侧真实交付（PathPlanner / DecisionEngine /
# ObstacleAvoidanceStrategy / Actuator），cloud 这套只是又画了一遍类型且没人接。
# 接口形状没有丢：docs/architecture-deepening-plan.md §2.3 保留了四份 SPI 定义与 §2.4 的
# 注册中心设计，真要开放第三方扩展时从那里重建；裁决过程见审计 §5 第 9 条与 §12。
# 防线是新门禁 scripts/check-config-keys.py：properties 声明但代码不读的键直接判红。

# ===== CV 评测指标层（F1：识别率/误检比/处理时间，对表国网机巡评测口径） =====
# 检测源：truth(默认)/vision-source/pixels/external；external 需同时配置 endpoint
# 出厂值 truth（与 CaptureService 的 @Value 默认一致）；切 external 时改成
# aerofleet.vision.source=external 并填下面的 endpoint，否则 ExternalVisionSource 会打 WARN 后降级
aerofleet.vision.source=truth
aerofleet.vision.external.endpoint=
aerofleet.vision.external.timeout-ms=3000
aerofleet.cv-eval.window-size=500
aerofleet.cv-eval.match-threshold-m=5.0
# ===== 电子围栏配置 =====
# 围栏检查周期（毫秒）
aerofleet.geofence.check-interval-ms=5000

# ===== 限飞区缓存配置 =====
# 数据源类型：MOCK / LOCAL_FILE / HTTP
aerofleet.geofence.restriction.source-type=MOCK
# 数据源路径（LOCAL_FILE 时为文件路径，HTTP 时为 URL）
# LOCAL_FILE 下非空即生效，优先于旧键 aerofleet.geofence.restriction-file
aerofleet.geofence.restriction.source-path=
# 定期刷新间隔（毫秒），默认 24 小时
aerofleet.geofence.restriction.refresh-interval-ms=86400000
# 拉取超时（毫秒），默认 30 秒
aerofleet.geofence.restriction.fetch-timeout-ms=30000
# 是否启用限飞区缓存
aerofleet.geofence.restriction.enabled=true
# 缓存 TTL（毫秒），超过后标记为 stale
aerofleet.geofence.restriction.cache-ttl-ms=86400000

# ===== 限飞区参与命令拦截 =====
# 限飞区（民航/厂商口径）是否参与命令拦截。
# 2026-10-21 之前限飞区**根本不参与拦截**（拦截链只遍历用户自建围栏）——
# 平台因此可以指挥无人机飞进民航禁飞区。
aerofleet.geofence.restriction.intercept-enabled=true
# 限飞区数据不可用时（数据源未接 / 加载失败 / 缓存为空）是否 fail-closed（拒发命令）。
# 默认 false（fail-open）的原因：真实限飞区数据源（HTTP 源）尚未实现，
# 此时 fail-closed 会让**所有命令都发不出去**。但 fail-open 也不等于「检查过」——
# 放行时会带上「未检查限飞区」标记（InterceptVerdict.isRestrictionDataUnavailable()），
# 供调用方看得见。接上真实数据源后建议改为 true。
aerofleet.geofence.restriction.intercept-fail-closed=false

# ===== 拦截日志配置 =====
# 拦截日志最大保留条数（InterceptLogStore 真实读取；超出会丢最旧，
# 丢弃累计数由 GET /api/v1/geofence/intercept/logs 的 evictedCount 暴露）
aerofleet.geofence.intercept.log-max-size=1000
# 注意：拦截动作本身的开关是 aerofleet.geofence.restriction.intercept-enabled（本文件上面），
# 这里曾经有一个同名近义键 aerofleet.geofence.intercept.enabled，**没有任何代码读它**，
# 运维改它以为关掉了硬拦截其实没关，故删除。

# ---- F2 机巢管控（dock）----
# transport=sim：命令经 HTTP 回环发往机巢模拟器（dock-sim，默认 18081）；
# transport=mqtt 属生产阶段（DJI Cloud API thing/product/{sn}/services，需 EMQX Broker），
# 接口已就位（DockGateway），本仓 PoC 默认 sim——见 README 已知边界。
aerofleet.dock.transport=sim
aerofleet.dock.sim-base-url=http://127.0.0.1:18081
aerofleet.dock.command-timeout-ms=5000
aerofleet.dock.heartbeat-period-ms=5000
aerofleet.dock.offline-after-periods=3
aerofleet.dock.temp-warn-c=55
aerofleet.dock.temp-crit-c=70
aerofleet.dock.schedule-poll-ms=30000
aerofleet.dock.unattended-flight-timeout-min=30

# ---- link-sim 运行时损伤控制（P2 #20）----
# 云端把 GET/PATCH /api/v1/link-sim/control 转发到本机 link-sim 的控制通道。
# link-sim 默认 --control-port 0（关闭）；要启用面板控制，必须以
#   link-sim --profile lte --control-port 14601
# 启动，否则这组端点返回 503 而不是假成功。
# 控制端口只绑 127.0.0.1，不要把它改成对外网卡。
aerofleet.linksim.control-url=http://127.0.0.1:14601/profile
aerofleet.linksim.timeout-ms=3000

# NTRIP 差分改正数转发（F6 / GAPS §十.10-3）。缺省关闭：没有 caster 配置就拉起
# 空转线程没有意义。开启后定时拉流 → Rtcm3Framer 切帧（CRC-24Q 校验）→ 按
# GPS_RTCM_DATA 官方规则分片（≤4×180B，超 720B 丢弃计数）→ 经 UdpGateway 下发
# 全部在线机（未配置 --rtk 的机收到也不抬升 fix_type——上界语义，见 #169）。
# username/password 视 caster 而定，匿名源留空。
aerofleet.ntrip.enabled=false
aerofleet.ntrip.host=
aerofleet.ntrip.port=2101
aerofleet.ntrip.mountpoint=
aerofleet.ntrip.username=
aerofleet.ntrip.password=
aerofleet.ntrip.reconnect-delay-ms=5000

# ===== 运维可见性补齐（审计 §12.2）=====
# 下面这些键此前**只存在于代码默认值**里：改它们本来就生效（@Value 会从任何属性源取值），
# 但在配置文件里搜不到，运维只能翻源码。owner 裁决的口径是"**只声明文档/部署/前端点过名的**"，
# 值必须与代码默认一致（声明本身零行为变化）。剩下的 17 个是内部实现参数（容量、轮询间隔、
# 线程池大小、仿真侧设备指纹、GB28181 SIP 地址、失联搜索的兜底常数）**故意不写在这里**——
# 写进去会被当成可调旋钮，其实调了要么没有语义、要么会让设备/对端对不上。
# 同步义务：改代码默认值时，记得同步这里；`scripts/check-config-keys.py` 只保证
# "声明的键有人读"，不保证值一致，值一致这条靠 review。

# 限飞区本地文件（旧键，LocalFileRestrictionSource）。新键是上面的
# aerofleet.geofence.restriction.source-path；两者同时设置且不一致时以 source-path 为准并打 WARN。
aerofleet.geofence.restriction-file=restrictions.json

# 运营报告的每小时成本口径（OperationsReportService）。默认 0 = 不算成本，
# 报告里成本字段按 0 出；这是"本仓不编造客户单价"的口径，改之前先确认合同里真有这个数字。
aerofleet.report.cost-per-hour=0

# 集群调度：自动空域预约的半径/时间窗，以及任务分配失败重试上限（TaskAssignmentService）。
aerofleet.scheduling.reservation.auto-radius-m=500
aerofleet.scheduling.reservation.auto-window-ms=1800000
aerofleet.scheduling.retry.max=1

# 启动期 ADMIN 引导账号（AdminBootstrapRunner）。口令刻意走环境变量、不写明文：
# 空值 = 不引导（与代码默认一致，也是 fail-safe 姿势）；username/tenant-id 是可直接声明的出厂值。
aerofleet.security.bootstrap-admin-username=admin
aerofleet.security.bootstrap-admin-password=${AEROFLEET_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
aerofleet.security.bootstrap-admin-tenant-id=1

# 反制雷达/感知的聚合周期、近域告警距离与轨迹 TTL（SensingTrackService）。
aerofleet.sensing.aggregate-ms=5000
aerofleet.sensing.proximity-alert-m=1000
aerofleet.sensing.track-ttl-ms=30000

# 仿真真值服务基址（CaptureService / OrbitService 共用）：truth 检测源与轨道回放都指这里。
aerofleet.sim-truth-base=http://127.0.0.1:18080

