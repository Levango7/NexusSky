# AeroFleet cloud backend — 通用配置（环境特定配置见 application-{dev,staging,prod}.properties）
spring.application.name=aerofleet-cloud

# 激活的环境（默认 prod=PostgreSQL；开发用 --spring.profiles.active=dev；测试用 --spring.profiles.active=test）
spring.profiles.active=prod

# HTTP REST port (Vite dev server proxies /api and /ws here)
server.port=8080

# MAVLink UDP gateway port (GCS convention: 14550; drone side binds 14540)
aerofleet.udp-port=14550

# UDP 网关安全配置（P1-3）
# 网卡绑定地址（0.0.0.0=所有网卡；生产环境应绑定内网网卡）
aerofleet.udp.bind-address=0.0.0.0
# 设备白名单：true=只接受已注册 sysid 的帧（prod 默认）；false=接受所有 sysid（dev 默认）
aerofleet.udp.device-whitelist-enabled=false
# 单 sysid 每秒最大帧数（滑动窗口频率限制，超限丢弃并记 WARN）
aerofleet.udp.max-frame-rate-per-sysid=100

# Behind-link-sim drone path: discovery heartbeat goes to the LTE proxy (14600), which forwards to the drone segment
aerofleet.drone-port=14540
# Extra simulated drones to discover (fault rig 14541, vision rig 14542, RF rig 14543), comma-joined
aerofleet.drone-extra-ports=14541,14542,14543

# A drone is considered offline after this many seconds without a HEARTBEAT
aerofleet.heartbeat-timeout-seconds=10

# Flight log persistence (JSON Lines, one file per UTC day under this dir)
aerofleet.flightlog.dir=./flight-logs
aerofleet.flightlog.track-interval-ms=1000

# ===== 安全认证（通用默认，生产环境应通过环境变量覆盖） =====
# JWT 签名密钥（HMAC-SHA256，至少 32 字符，生产环境必须更换）
aerofleet.security.jwt-secret=aerofleet-dev-secret-change-in-production-at-least-32-chars
# JWT 有效期（秒）
aerofleet.security.jwt-expiry=3600

# ===== JWT 签名算法配置（P2-2 RS256 非对称签名升级） =====
# 签名算法：RS256（默认，非对称签名）或 HS256（对称签名回退）
jwt.algorithm=RS256
# RSA 私钥（PEM 格式 Base64 编码，用于签发 token；生产环境必须配置）
jwt.private-key=
# RSA 公钥（PEM 格式 Base64 编码，用于验证 token；生产环境必须配置）
jwt.public-key=
# HMAC 密钥（兼容旧配置，当 algorithm=HS256 或 RS256 回退时使用）
jwt.secret=
# 开发环境自动生成 RSA 密钥对（仅适用于开发，生产环境必须设为 false 并配置正式密钥）
jwt.generate-keys=false
# 内置用户（格式 username:password,username2:password2，生产环境应使用外部 IDP）
aerofleet.security.users=admin:admin
# RBAC 开关默认（生产环境在 application-prod.properties 中启用）
aerofleet.security.rbac-enabled=false

# ===== DeviceRegistry 持久化 =====
# false=纯内存（默认，向后兼容）；true=持久化到 H2/JPA
aerofleet.device-registry.persist=false

# ===== JPA 通用配置 =====
spring.jpa.hibernate.ddl-auto=validate

# ===== 数据源默认配置（prod: PostgreSQL） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== Flyway 数据库迁移 =====
# 对已有 schema 建立基线（dev 的 H2 文件库已有 Hibernate 创建的表）
spring.flyway.baseline-on-migrate=true

# ===== Redis 默认配置（prod 启用） =====
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=0
# Lettuce 连接池
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=5s

# ===== 缓存默认配置（prod: Redis） =====
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=aerofleet::
# 默认 TTL 30 分钟
spring.cache.redis.time-to-live=30m

# ===== 可观测性：Actuator + Prometheus =====
# 暴露 health/info/metrics/prometheus 端点
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 启用 Prometheus 指标导出
management.metrics.export.prometheus.enabled=true
# 指标标签通用前缀
management.metrics.tags.application=aerofleet-cloud

# ===== OpenAPI 文档 =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=io.aerofleet.cloud.api,io.aerofleet.cloud.mission,io.aerofleet.cloud.vision,io.aerofleet.cloud.telemetry
springdoc.paths-to-match=/api/v1/**

# ===== License 授权 =====
# License key（Base64 编码，未配置时为开发版）
aerofleet.license.key=
# License RSA 公钥（Base64 X.509 格式，未配置时开发模式自动生成密钥对）
# 生产环境必须配置：使用 LicenseKeyGenerator 生成密钥对，公钥配置于此，私钥由签发方安全保管
aerofleet.license.public-key=

# ===== WebSocket 连接数限制 =====
# 单 IP 最大 WS 连接数
aerofleet.ws.max-connections-per-ip=10
# 单租户最大 WS 连接数
aerofleet.ws.max-connections-per-tenant=20

# ===== 多租户隔离 =====
# 每租户每分钟 API 调用上限
aerofleet.tenant.rate-limit=100

# ===== API 版本 =====
aerofleet.api.version=v1

# ===== 审计日志（默认关闭，生产环境在 application-prod.properties 中启用） =====
aerofleet.audit.enabled=false
# ===== 密码加密（SurveillanceDeviceEntity password 字段 AES 加密） =====
# 开发环境默认密钥，生产环境必须通过环境变量覆盖
aerofleet.encryption.key=aerofleet-dev-encryption-key
# ===== 插件配置（P1-5 SPI 框架） =====
# 配置格式：aerofleet.plugins.{category}.{type}.enabled=true/false
# 未配置时默认启用，仅显式设为 false 时才禁用
# 载荷插件
aerofleet.plugins.payload.spray.enabled=true
aerofleet.plugins.payload.gripper.enabled=true
# 通信协议插件
aerofleet.plugins.transport.mavlink-udp.enabled=true
# AI 决策策略插件
aerofleet.plugins.ai.rtl.enabled=true
aerofleet.plugins.ai.avoid.enabled=true
aerofleet.plugins.ai.adapt-path.enabled=true
# 航线规划算法插件
aerofleet.plugins.route.astar.enabled=true
aerofleet.plugins.route.rrt.enabled=true
