# ============================================================
# 预发布环境 profile (staging)
# 激活方式：--spring.profiles.active=staging
# ============================================================

# ===== 安全认证 =====
# 生产模式：启用 JWT 认证
aerofleet.security.dev-mode=false
# RBAC：预发布显式打开，不靠继承 base 默认（staging 的价值就是在上线前把生产的
# 安全配置跑一遍；此前 staging 没有这一行，等于预发布环境不验角色）
aerofleet.security.rbac-enabled=true
# 默认忽略 X-Forwarded-For，以直连地址进行登录限流。
# 仅当后端只允许可信代理访问，且代理覆盖客户端传入的转发头时，才可设为 true。
aerofleet.security.trust-forwarded-for=false
# License 拦截器：预发布环境启用校验
aerofleet.license.enabled=true
# JWT 密钥：与 prod 一致，必须通过环境变量 AEROFLEET_JWT_SECRET 设置，无默认值
# （不设置则启动失败/fail-fast）。若未覆盖，staging 将继承 application.properties
# 中的开发密钥，导致预发布环境使用可预测的签名密钥。
aerofleet.security.jwt-secret=${AEROFLEET_JWT_SECRET}
# 用户凭证：与 prod 一致，必须通过环境变量 AEROFLEET_USERS 设置（格式 username:password[:ROLE]，缺省角色 OPERATOR）
aerofleet.security.users=${AEROFLEET_USERS}
# 凭据加密密钥：与 prod 一致，必须通过环境变量 AEROFLEET_ENCRYPTION_KEY 设置，无默认值则启动失败。
# 预发布的意义就是把生产的安全配置原样跑一遍；此前 staging 漏了这条，会用 base 的
# 明文默认值跑通，等于验证了一个生产上并不成立的状态。
aerofleet.encryption.key=${AEROFLEET_ENCRYPTION_KEY}
# 飞行日志：与 prod 一致落库
aerofleet.flightlog.persist-to-db=true
# CORS 允许的源：限制到 staging 域名
aerofleet.security.allowed-origins=https://staging.aerofleet.io,https://gcs-staging.aerofleet.io

# ===== PostgreSQL 数据库（占位配置，通过环境变量覆盖） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_staging}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway 是 schema 的唯一真相源：预发布与 prod 同口径（迁移 + validate）。
# 原为 update：Hibernate 隐式补列会盖住"迁移与实体不一致"的漂移，
# 让预发布失去"上生产前排练"的意义（2026-09-30 prod validate 实测抓出 V2/V3 缺列）。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== UDP 网关安全（与 prod 对齐） =====
# 2026-10-01 补齐：staging 此前没有这两行，等于继承了 base 的
# device-whitelist-enabled=false + device-registry.persist=false，
# 验证的是一个「接受任意 sysid 且注册表重启即失」的状态——与 prod 相反。
# 白名单与注册表持久化必须**成对**打开：白名单只认已注册 sysid，而注册条目
# 若只在内存里，重启即消失，ADMIN 登记过的设备又变回陌生 sysid。
aerofleet.udp.device-whitelist-enabled=true
aerofleet.device-registry.persist=true

# ===== 日志级别：INFO =====
logging.level.root=INFO
logging.level.io.aerofleet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== Swagger UI：禁用 =====
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== Actuator：预发布环境限制健康详情 =====
management.endpoint.health.show-details=when-authorized