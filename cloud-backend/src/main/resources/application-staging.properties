# ============================================================
# 预发布环境 profile (staging)
# 激活方式：--spring.profiles.active=staging
# ============================================================

# ===== 安全认证 =====
# 生产模式：启用 JWT 认证
aerofleet.security.dev-mode=false
# 默认忽略 X-Forwarded-For，以直连地址进行登录限流。
# 仅当后端只允许可信代理访问，且代理覆盖客户端传入的转发头时，才可设为 true。
aerofleet.security.trust-forwarded-for=false
# License 拦截器：预发布环境启用校验
aerofleet.license.enabled=true
# CORS 允许的源：限制到 staging 域名
aerofleet.security.allowed-origins=https://staging.aerofleet.io,https://gcs-staging.aerofleet.io

# ===== PostgreSQL 数据库（占位配置，通过环境变量覆盖） =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerofleet_staging}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerofleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== 日志级别：INFO =====
logging.level.root=INFO
logging.level.io.aerofleet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== Swagger UI：禁用 =====
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== Actuator：预发布环境限制健康详情 =====
management.endpoint.health.show-details=when-authorized