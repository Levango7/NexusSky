# NexusSky gcs-web Nginx 配置
# - 静态文件服务（Vite 构建产物 /usr/share/nginx/html）
# - /api 反向代理到 cloud-backend:8080（REST API）
# - /ws  WebSocket 升级代理到 cloud-backend:8080（实时遥测推送）
# - SPA history fallback（未命中的非文件请求回退到 index.html）
#
# 后端主机名 cloud-backend 对应 docker-compose 服务名 / k8s Service 名。

# 上游：cloud-backend REST + WebSocket
upstream cloud_backend {
    server cloud-backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|map)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass http://cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # OpenAPI / Swagger 资源（springdoc 配置在 /swagger-ui.html、/v3/api-docs）
    location /swagger-ui.html { proxy_pass http://cloud_backend; proxy_set_header Host $host; }
    location /v3/api-docs     { proxy_pass http://cloud_backend; proxy_set_header Host $host; }

    # Actuator（仅健康/指标，生产可加访问控制）
    location /actuator/ {
        proxy_pass http://cloud_backend;
        proxy_set_header Host $host;
    }

    # WebSocket 升级代理（实时遥测 / 任务推送）
    location /ws {
        proxy_pass http://cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA history fallback：先尝试文件，再目录，最后回退 index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}