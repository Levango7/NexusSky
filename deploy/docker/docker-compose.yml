# NexusSky 生产容器化编排（多阶段构建镜像）
# 用法：docker compose -f deploy/docker/docker-compose.yml up --build
#
# 与项目根 docker-compose.yml 的区别：
#   - 根 compose 用 host 网络 + 挂载 jar（开发快迭代）
#   - 本 compose 用多阶段构建镜像 + 桥接网络（生产可移植，K8s 前置验证）
#
# 健康检查端点统一为 /actuator/health
# 来源：cloud-backend application.properties + 经验库
#   2026-09-13-spring-boot-actuator-health-endpoint-smoke-test-mismatch
#   2026-09-14-health-endpoint-unify-by-tech-stack

services:
  # ===== Redis 缓存：cloud-backend 依赖 =====
  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ===== PostgreSQL 数据库：cloud-backend prod profile 依赖 =====
  postgres:
    image: postgres:15-alpine
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_DB=aerofleet_prod
      - POSTGRES_USER=aerofleet
      - POSTGRES_PASSWORD=aerofleet_dev_password
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ===== 云端后端：Spring Boot REST + WebSocket + MAVLink 网关 =====
  cloud-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cloud
    image: nexussky/cloud-backend:1.0.0
    ports:
      - "28080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AEROFLEET_SECURITY_DEV_MODE=false
      # 刻意不留默认值：未显式注入即启动失败（原内置密钥长度已达校验阈值，可伪造任意租户/角色 JWT）
      - AEROFLEET_SECURITY_JWT_SECRET=${AEROFLEET_SECURITY_JWT_SECRET:?AEROFLEET_SECURITY_JWT_SECRET is required (>=32 chars)}
      - AEROFLEET_SECURITY_ALLOWED_ORIGINS=http://localhost:3000
      - AEROFLEET_JWT_SECRET=${AEROFLEET_JWT_SECRET:?AEROFLEET_JWT_SECRET is required (>=32 chars)}
      - AEROFLEET_USERS=${AEROFLEET_USERS:?AEROFLEET_USERS is required (username:password[:ROLE])}
      # 凭据加密密钥（AES-GCM，保护安防设备 ONVIF 口令与 webhook secret）：
      # prod 无缺省 fail-fast（application-prod.properties:25），未注入即启动失败
      - AEROFLEET_ENCRYPTION_KEY=${AEROFLEET_ENCRYPTION_KEY:?AEROFLEET_ENCRYPTION_KEY is required}
      # 设备/边缘摄取通道的共享 API Key（四条 OPERATOR 档写端点：edge/results、loRa/alarm、
      # offline-alarm/batch-upload|flush、alarms/events）。与上面的必填项不同，这里刻意允许留空：
      # 留空=不引导任何 key，摄取端点在 prod 下不可用（本来就要凭据，宁缺不滥发一把后门 key）。
      # 要跑通设备上报就注入一个 >=16 位的值；轮换=改值后重启，库里只存 SHA-256 哈希。
      - AEROFLEET_SECURITY_DEVICE_INGEST_API_KEY=${AEROFLEET_SECURITY_DEVICE_INGEST_API_KEY:-}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerofleet_prod
      - SPRING_DATASOURCE_USERNAME=aerofleet
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      # Flyway 是 schema 的唯一真相源：本镜像与 prod profile 一致，
      # 迁移必须真实执行（原配置关 Flyway + ddl-auto=update，
      # 相当于让 Hibernate 隐式建表，迁移脚本从未在生产通路被验证过）。
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # MAVLink UDP 网关绑定地址：此处**有意不注入**，保持 prod 默认 0.0.0.0。
      # 容器内必须监听所有接口才能被上方 `ports:` 映射（绑 127.0.0.1 会让映射失效）。
      # 真正的入站收口由网络层完成（K8s 见 deploy/k8s/networkpolicy.yaml 的 14550/UDP 规则）。
      # 仅当"裸机/VM 直跑 jar + 多网卡需限定内网口"时才设：
      #   - AEROFLEET_UDP_BIND_ADDRESS=10.0.1.5
      # 详见 docs/security-design.md §6.4「为什么生产默认仍是 0.0.0.0」
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== 无人机模拟器：MAVLink over UDP =====
  drone-sim:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sim
    image: nexussky/drone-sim:1.0.0
    command: ["java", "-jar", "app.jar", "--sysid=1", "--port=14540"]
    depends_on:
      cloud-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Web 地面站：Nginx 静态 + 反代 =====
  gcs-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    image: nexussky/gcs-web:1.0.0
    ports:
      # nginx 容器内监听 8080（非 root 不能绑 80）；宿主机仍暴露 23000
      - "23000:8080"
    depends_on:
      cloud-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
