# NexusSky 生产容器化编排（多阶段构建镜像）
# 用法：docker compose -f deploy/docker/docker-compose.yml up --build
#
# 与项目根 docker-compose.yml 的区别：
#   - 根 compose 用 host 网络 + 挂载 jar（开发快迭代）
#   - 本 compose 用多阶段构建镜像 + 桥接网络（生产可移植，K8s 前置验证）
#
# 健康检查端点统一为 /actuator/health
# 来源：cloud-backend application.properties + 经验库
#   2026-09-13-spring-boot-actuator-health-endpoint-smoke-test-mismatch
#   2026-09-14-health-endpoint-unify-by-tech-stack

version: "3.8"

services:
  # ===== Redis 缓存：cloud-backend 依赖 =====
  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ===== PostgreSQL 数据库：cloud-backend prod profile 依赖 =====
  postgres:
    image: postgres:15-alpine
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_DB=aerofleet_prod
      - POSTGRES_USER=aerofleet
      - POSTGRES_PASSWORD=aerofleet_dev_password
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ===== 云端后端：Spring Boot REST + WebSocket + MAVLink 网关 =====
  cloud-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cloud
    image: nexussky/cloud-backend:1.0.0
    ports:
      - "28080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AEROFLEET_SECURITY_DEV_MODE=false
      - AEROFLEET_SECURITY_JWT_SECRET=change-this-jwt-secret-in-production-min-32-chars
      - AEROFLEET_SECURITY_ALLOWED_ORIGINS=http://localhost:3000
      - AEROFLEET_JWT_SECRET=change-this-jwt-secret-in-production-min-32-chars
      - AEROFLEET_USERS=admin:admin
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerofleet_prod
      - SPRING_DATASOURCE_USERNAME=aerofleet
      - SPRING_DATASOURCE_PASSWORD=aerofleet_dev_password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== 无人机模拟器：MAVLink over UDP =====
  drone-sim:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sim
    image: nexussky/drone-sim:1.0.0
    command: ["java", "-jar", "app.jar", "--sysid=1", "--port=14540"]
    depends_on:
      cloud-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Web 地面站：Nginx 静态 + 反代 =====
  gcs-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    image: nexussky/gcs-web:1.0.0
    ports:
      - "23000:80"
    depends_on:
      cloud-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
