# NexusSky gcs-web Deployment + Service
# Web 地面站：Nginx 静态托管 + 反代 cloud-backend
# Service 用 NodePort 便于无 Ingress 环境访问；生产建议走 ingress.yaml
# 用法：kubectl apply -f deploy/k8s/gcs-web.yaml -n nexussky
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-web
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: gcs-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/component: gcs-web
    spec:
      containers:
        - name: gcs-web
          image: nexussky/gcs-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gcs-web
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
spec:
  # NodePort 兼容无 LoadBalancer 的裸金属集群；
  # 云环境可改 LoadBalancer，或直接走 ingress.yaml
  type: NodePort
  selector:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
