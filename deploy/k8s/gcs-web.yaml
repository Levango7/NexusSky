# NexusSky gcs-web Deployment + Service
# Web 地面站：Nginx 静态托管 + 反代 cloud-backend
# Service 用 NodePort 便于无 Ingress 环境访问；生产建议走 ingress.yaml
# 用法：kubectl apply -f deploy/k8s/gcs-web.yaml -n nexussky
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-web
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: gcs-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/component: gcs-web
    spec:
      securityContext:
        runAsNonRoot: true
        # 必须给数字 uid：镜像 USER 是名字 nginx，仅设 runAsNonRoot 时 kubelet 无法
        # 校验非 root（CreateContainerConfigError: image has non-numeric user nginx）
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: gcs-web
          image: nexussky/gcs-web:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            # nginx 以非 root 运行，容器内监听 8080（非特权端口）；
            # Service port 80 经 targetPort: http 转发到此
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # readOnlyRootFilesystem 下 nginx 需可写的 pid 与临时目录，否则
          # mkdir() "/var/cache/nginx/client_temp" failed: Read-only file system
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gcs-web
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
spec:
  # NodePort 兼容无 LoadBalancer 的裸金属集群；
  # 云环境可改 LoadBalancer，或直接走 ingress.yaml
  type: NodePort
  selector:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: gcs-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
