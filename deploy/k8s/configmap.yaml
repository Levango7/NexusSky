# NexusSky 非敏感配置（ConfigMap）
# 敏感数据（JWT 密钥、DB 密码）放 secret.yaml
# 用法：kubectl apply -f deploy/k8s/configmap.yaml -n nexussky
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexussky-config
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
data:
  # Spring Boot 激活的生产 Profile
  SPRING_PROFILES_ACTIVE: "prod"
  # 关闭开发模式，启用 JWT 认证（对应 aerofleet.security.dev-mode）
  AEROFLEET_SECURITY_DEV_MODE: "false"
  # CORS 允许的前端来源（Ingress 暴露的域名）
  AEROFLEET_SECURITY_ALLOWED_ORIGINS: "http://nexussky.local,http://localhost:3000"
  # PostgreSQL 连接（与 prod profile 的 driver 口径一致，见 application-prod.properties:32-36）。
  # 必须指向可达的 PG 实例：dev/prod 两个 profile 的数据源缺省都是 PG，prod 的
  # driver 硬编码 org.postgresql.Driver；DB 写通路只在 CI Pass C 的真 PG 上有门禁
  # （ci-integration-test.sh:43「H2 掩盖 PG 方言风险」），换成 H2 会绕开全部验证。
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/aerofleet_prod"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  # 飞行日志目录：必须与 Deployment 的 flight-logs 卷 mountPath 一致（/app/logs），
  # 否则日志落在只读根文件系统上的临时路径，写入失败/重启即丢。
  AEROFLEET_FLIGHTLOG_DIR: "/app/logs"
  # MAVLink UDP 网关绑定地址：**有意不设置**，保持 prod 默认 0.0.0.0。
  # Pod IP 每次重建都会变，绑具体 IP 会导致 UDP 网关起不来；
  # 入站收口由 networkpolicy.yaml 完成（仅放行同命名空间 → 14550/UDP）。
  # 详见 docs/security-design.md §6.4「为什么生产默认仍是 0.0.0.0」
  #
  # 注：UDP 端口（14550）此处也不设置——UdpGateway 的
  # @Value("${aerofleet.udp-port:14550}") 已内置同值默认，
  # networkpolicy.yaml 亦按 14550 硬编码。三处一致，无需再声明一份副本。
  # schema 由启动时的 Flyway 迁移建立后校验（与 prod 同口径）；
  # update 会让 Hibernate 隐式建表/补列，绕开迁移脚本
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  # Actuator 端点暴露（与 application.properties 对齐）
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  # 探针解耦：本清单不部署 redis（Redis 仅 RedisRateLimiter 使用，失联时优雅放行，
  # 见 RedisRateLimiter），聚合 /actuator/health 会因 redis 分量 DOWN 恒 503，不能作探针。
  # 显式开启探针分组端点，readiness 只看 readinessState+db（PG 可用才接流量）；
  # liveness 只看 livenessState（redis/Prometheus 等可选组件不参与重启决策）。
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE: "livenessState"
  # JWT 有效期（秒）
  AEROFLEET_SECURITY_JWT_EXPIRY: "3600"
  # 内置用户已迁入 secret（AEROFLEET_USERS），此处不再明文保留
