# NetworkPolicy: 限制 actuator/prometheus 端点仅集群内访问
# cloud-backend 的 /actuator/* 和 /prometheus 端点仅允许授权来源访问
#
# 核查修复（2026-10-05，Round E）——此前版本在策略强制型 CNI（Calico/Cilium）
# 下有两个必然断链（flannel/kind 默认不执行策略，所以一直没暴露）：
# 1) Ingress 控制器被挡死：只放行本命名空间 → 8080/TCP，而控制器 Pod 在
#    ingress-nginx 命名空间，ingress.yaml 的全部路由 503/超时。
#    修复：追加放行 ingress-nginx 命名空间到 8080/TCP。
# 2) MAVLink 回包被挡死：backend UDP 网关从 14550 探测 sim（GCS HEARTBEAT），
#    sim 回包/遥测发回 backend:14550/UDP；只放行 8080/TCP 时回包全丢。
#    修复：本命名空间规则追加 14550/UDP。（sim 经 REST 注册上报地址，backend
#    直连 Pod IP，不经 Service，Service 无需暴露 UDP 端口。）
# 用法：kubectl apply -f deploy/k8s/networkpolicy.yaml -n nexussky
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-backend-actuator-restrict
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: cloud-backend
  policyTypes:
    - Ingress
  ingress:
    # 允许同 namespace 的所有 Pod 访问（集群内部监控、服务间调用）
    # REST/WS（8080/TCP）+ MAVLink UDP 网关回包（14550/UDP）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexussky
      # NetworkPolicyPort 无 name 字段（该字段属于 Service），命名端口应写在 port 上
      ports:
        - port: 8080
          protocol: TCP
        - port: 14550
          protocol: UDP
    # Ingress 控制器命名空间（nginx-ingress 惯例 ingress-nginx）：
    # 控制器 Pod 跨命名空间转发 /api /ws /actuator / 到 backend:8080。
    # 换了控制器命名空间（如 kustomize 改名）需同步这里。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
