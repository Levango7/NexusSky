# NexusSky 内置 PostgreSQL（评估/演示）
# 用法：kubectl apply -f deploy/k8s/postgres.yaml -n nexussky
#
# 定位：configmap.yaml 的 SPRING_DATASOURCE_URL 指向 postgres:5432，本清单
# 把这个服务名补齐——此前 raw k8s 路径没有任何 postgres 定义，readiness 探针
# （含 db 分量）永远 NotReady，只能"集群自备 PG"（Round D 遗留开放项）。
# 生产环境建议撤掉本清单，用外部 PG / CloudNativePG Operator
# （备份、高可用、版本升级由专业组件负责）。
# 与 docker-compose.yml 的 postgres 服务同口径：postgres:15-alpine +
# aerofleet_prod/aerofleet。
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: postgres
spec:
  # 单副本：评估/演示定位，不做 HA（生产用外部 PG/Operator）
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/component: postgres
    spec:
      # postgres:15-alpine 以 uid 70（postgres 用户）运行，满足 runAsNonRoot
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # 刻意不开 readOnlyRootFilesystem：PG initdb 需写数据目录之外的
            # 临时路径（/var/run/postgresql 等），写面已由 PVC 显式限定
          env:
            - name: POSTGRES_DB
              value: "aerofleet_prod"
            - name: POSTGRES_USER
              value: "aerofleet"
            # 与 secret.yaml 的 SPRING_DATASOURCE_PASSWORD 同源（改这里前先改 secret）
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexussky-secret
                  key: SPRING_DATASOURCE_PASSWORD
            # PG_DATA 指到 PVC 子目录：volumeClaimTemplates 挂载点根目录归
            # provisioner 所有（非 root 无权 chown），lost+found 会让 initdb
            # 报 "directory exists but is not empty"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aerofleet", "-d", "aerofleet_prod"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aerofleet", "-d", "aerofleet_prod"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  # 每副本独立卷（StatefulSet 正确形态；PVC 名 postgres-pgdata-<ordinal>）
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: nexussky
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
