# NexusSky cloud-backend Deployment + Service
# Spring Boot REST + WebSocket + MAVLink 网关
# 健康检查：/actuator/health（与 application.properties、docker-compose、helm 统一）
# 来源：经验库 2026-09-13-spring-boot-actuator-health-endpoint-smoke-test-mismatch
# 用法：kubectl apply -f deploy/k8s/cloud-backend.yaml -n nexussky
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: cloud-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/component: cloud-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: cloud-backend
          image: nexussky/cloud-backend:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexussky-config
            - secretRef:
                name: nexussky-secret
          # 就绪探针：通过 /actuator/health 才接流量
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活探针：失败则重启容器
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 启动探针：Spring Boot 冷启动给足宽限
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: flight-logs
              mountPath: /app/logs
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: flight-logs
          persistentVolumeClaim:
            claimName: flight-logs
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-backend
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
