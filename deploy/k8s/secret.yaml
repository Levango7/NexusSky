# NexusSky 敏感配置（Secret）
# 注意：stringData 明文写入 etcd，生产应改用 SealedSecret / external-secrets / Vault
# 用法：kubectl apply -f deploy/k8s/secret.yaml -n nexussky
apiVersion: v1
kind: Secret
metadata:
  name: nexussky-secret
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
type: Opaque
stringData:
  # JWT 签名密钥（HMAC-SHA256，至少 32 字符）
  # prod profile 实际读取的是 AEROFLEET_JWT_SECRET（application-prod.properties:17）；
  # 两个名字都保留，与 deploy/docker/docker-compose.yml 的注入口径保持一致。
  AEROFLEET_JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET_AT_LEAST_32_CHARS"
  AEROFLEET_SECURITY_JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET_AT_LEAST_32_CHARS"
  # 凭据加密密钥（AES-GCM，保护安防设备 ONVIF 口令 / webhook secret）。
  # prod 为无缺省 fail-fast（application-prod.properties:25），缺失则后端拒绝启动——必填。
  AEROFLEET_ENCRYPTION_KEY: "REPLACE_WITH_STRONG_ENCRYPTION_KEY_AT_LEAST_32_CHARS"
  # 内置用户（username:password[:ROLE]）。prod 读取 AEROFLEET_USERS（:19）。
  # 刻意留空，不提供 admin:admin 之类可猜默认口令；部署前必须填入真实账号，否则无人可登录。
  AEROFLEET_USERS: ""
  # 数据库凭据（迁移到外部 PostgreSQL 时必须替换）
  SPRING_DATASOURCE_USERNAME: "aerofleet"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
