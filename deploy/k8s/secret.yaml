# NexusSky 敏感配置（Secret）
# 注意：stringData 明文写入 etcd，生产应改用 SealedSecret / external-secrets / Vault
# 用法：kubectl apply -f deploy/k8s/secret.yaml -n nexussky
apiVersion: v1
kind: Secret
metadata:
  name: nexussky-secret
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
type: Opaque
stringData:
  # JWT 签名密钥（HMAC-SHA256，至少 32 字符）
  # 占位符：部署前必须替换为强随机值
  AEROFLEET_SECURITY_JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET_AT_LEAST_32_CHARS"
  # 数据库凭据（当前 H2 内存库未启用密码，保留字段供迁移到外部 DB 时使用）
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
