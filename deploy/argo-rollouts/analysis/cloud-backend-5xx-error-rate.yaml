# Argo Rollouts AnalysisTemplate：cloud-backend 5xx 错误率（自动回滚，#323 L2）。
#
# 语义：error_rate = 5xx 请求占 5 分钟窗口内总请求的比例。
#   指标来自 Spring Boot actuator Prometheus 指标 `http_server_requests_seconds_count{status=~"5.."}`。
#   successCondition：error_rate <= 5%（一次满足计 1 次成功）。
#   failureLimit：3——失败上限（失败测量累计超过上限即 AnalysisRun 失败，Rollouts 语义）。
#   失败后 Rollout 自动 abort：canary 缩为 0，流量回稳在 stable——正是 #323 L2 的自动回滚。
#
# 注意（2026-11-22 真实 Prometheus 实测修正）：分子 `sum(rate(...status=~"5.."))`
#   在「没有 5xx 请求」时返回**空向量而非 0**，整条查询无结果，AnalysisRun 直接 Error
#   （实测 message: "no data returned from the metric provider"），happy path 永远跑不通。
#   因此分子用 `or vector(0)` 兜底，分母用 `clamp_min(..., 0.001)` 防除零：
#   无 5xx → 0（成功），无流量 → 0（成功，表示没有错误）。
#   运维侧需把 `prometheusAddress` 指向实际 Prometheus：
#   K8s 用 FQDN（见 cloud-backend-rollout.yaml 的 args），compose 用 http://prometheus:9090。
#   prod profile 下 `/actuator/prometheus` 需 Bearer token（SecurityConfig 只匿名开放 health*），
#   Prometheus 抓取侧必须配 authorization；token 过期会导致 target 401、指标停更。
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloud-backend-5xx-error-rate
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
spec:
  args:
    - name: prometheusAddress
      value: http://prometheus:9090
  metrics:
    - name: http-5xx-error-rate
      interval: 30s
      successCondition: result[0] <= 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: "{{args.prometheusAddress}}"
          query: |
            (
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              or vector(0)
            )
            /
            clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
