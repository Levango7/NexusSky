# NexusSky Secret（敏感配置）
# 生产建议改用 SealedSecret / external-secrets / Vault
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexussky.secretFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # prod profile 实际读取 AEROFLEET_JWT_SECRET（application-prod.properties:17）；两个名字都保留
  AEROFLEET_JWT_SECRET: {{ .Values.security.jwtSecret | quote }}
  AEROFLEET_SECURITY_JWT_SECRET: {{ .Values.security.jwtSecret | quote }}
  # 凭据加密密钥（AES-GCM）：prod 无缺省 fail-fast（application-prod.properties:25），必填
  AEROFLEET_ENCRYPTION_KEY: {{ .Values.security.encryptionKey | quote }}
  # 内置用户（prod 读取 AEROFLEET_USERS，:19）；该键已从 configmap 迁入 secret
  AEROFLEET_USERS: {{ .Values.security.users | quote }}
  # 首次管理员引导口令（AdminBootstrapRunner）：非空时启动阶段在 DB 建/重置 ADMIN。
  # 留空=不介入；prod 登录走 UserRepository，此键才是建出首个可用账号的通路。
  AEROFLEET_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.security.bootstrapAdminPassword | quote }}
  AEROFLEET_SECURITY_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.security.bootstrapAdminUsername | quote }}
  AEROFLEET_SECURITY_BOOTSTRAP_ADMIN_TENANT_ID: {{ .Values.security.bootstrapAdminTenantId | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
