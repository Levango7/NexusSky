# NexusSky Secret（敏感配置）
# 生产建议改用 SealedSecret / external-secrets / Vault
apiVersion: v1
kind: Secret
metadata:
  name: nexussky-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AEROFLEET_SECURITY_JWT_SECRET: {{ .Values.security.jwtSecret | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
