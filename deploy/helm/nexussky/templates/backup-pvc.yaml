{{- if and .Values.database.builtin.enabled .Values.database.backup.enabled }}
# 备份落盘卷：与内置 PG 的 pgdata 分开，避免轮转删除/写满污染数据卷。
# 名带 release 前缀（<release>-pg-backup），与 flight-logs PVC 同款命名策略。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-pg-backup" (include "nexussky.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.backup.size }}
  {{- if .Values.database.builtin.storageClassName }}
  storageClassName: {{ .Values.database.builtin.storageClassName }}
  {{- end }}
{{- end }}