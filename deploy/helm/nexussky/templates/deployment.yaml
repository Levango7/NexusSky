{{/*
镜像 tag 契约（2026-11-18）：唯一可部署标识是 sha-<short> 或 semver 版本（如 1.0.7），
两者都由 CI 产出且不可变。latest 会漂移、0.1.0 无任何 CI 产出——都不能当回滚目标。
守卫放这里而不是 values.yaml 注释里，是为了让 `helm install` 直接失败，而不是部署一个
不存在的镜像后在 ErrImagePull 里才发现。见 docs/rollback-runbook.md §0③。
*/}}
{{- if not .Values.imageTag -}}
{{- fail "imageTag 未设置：必须显式指定 sha-<short>（CI 自动产出）或 semver 版本（如 1.0.7）。禁止依赖默认值，见 docs/rollback-runbook.md §0③。" -}}
{{- end -}}
{{- if or (eq .Values.imageTag "latest") (eq .Values.imageTag "0.1.0") -}}
{{- fail "imageTag=latest / 0.1.0 禁止部署：latest 随每次 master push 漂移，0.1.0 无 CI 产出，两者都不能作为回滚目标。请用 sha-<short> 或 semver 版本。" -}}
{{- end -}}
# NexusSky Deployments：cloud-backend + drone-sim + gcs-web
# cloud-backend 探针走 /actuator/health/{readiness,liveness} 分组端点
# （chart 不部署 redis，聚合端点会因 redis 分量 DOWN 恒 503，见 configmap 模板）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexussky.cloudBackendFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cloud-backend
spec:
  replicas: {{ .Values.cloudBackend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cloud-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cloud-backend
    spec:
      # 与 deploy/k8s/cloud-backend.yaml 保持同一套加固口径
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: cloud-backend
          image: "{{ .Values.imageRegistry }}{{ .Values.cloudBackend.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.cloudBackend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nexussky.configFullname" . }}
            - secretRef:
                name: {{ include "nexussky.secretFullname" . }}
          # 就绪探针：readinessState+db 全 UP 才接流量（PG 不可达时摘流量而非重启）
          readinessProbe:
            httpGet:
              path: {{ .Values.cloudBackend.readinessPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活探针：只看 livenessState（redis 等可选组件 DOWN 不触发重启）
          livenessProbe:
            httpGet:
              path: {{ .Values.cloudBackend.livenessPath }}
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 启动探针：Spring Boot 冷启动给足宽限
          startupProbe:
            httpGet:
              path: {{ .Values.cloudBackend.livenessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.cloudBackend.resources | nindent 12 }}
          # 飞行日志（JSONL）持久化卷：挂载路径必须与 AEROFLEET_FLIGHTLOG_DIR 一致
          # （configmap 设为 /app/logs），否则日志仍落在容器临时层、重启即丢。
          volumeMounts:
            - name: flight-logs
              mountPath: /app/logs
            # readOnlyRootFilesystem 下 /tmp 必须可写（Spring/Tomcat 需要）
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flight-logs
          persistentVolumeClaim:
            claimName: {{ include "nexussky.flightLogsFullname" . }}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexussky.droneSimFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: drone-sim
spec:
  replicas: {{ .Values.droneSim.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: drone-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: drone-sim
    spec:
      containers:
        - name: drone-sim
          image: "{{ .Values.imageRegistry }}{{ .Values.droneSim.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["java", "-jar", "app.jar", "--sysid={{ .Values.droneSim.sysid }}", "--port={{ .Values.droneSim.port }}"]
          ports:
            - name: mavlink
              containerPort: {{ .Values.droneSim.port }}
              protocol: UDP
          resources:
            {{- toYaml .Values.droneSim.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexussky.gcsWebFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gcs-web
spec:
  replicas: {{ .Values.gcsWeb.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gcs-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexussky
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gcs-web
    spec:
      # 与 deploy/k8s/gcs-web.yaml 保持同一套加固口径
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: gcs-web
          image: "{{ .Values.imageRegistry }}{{ .Values.gcsWeb.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # nginx 反代上游（/api、/ws、/actuator → cloud-backend）：镜像内
          # /etc/nginx/templates 在启动时经 envsubst 渲染，上游地址来自这两个
          # env（见 Dockerfile.web / deploy/docker/nginx.conf）。Service 名已
          # release 化，不能再用镜像缺省值 cloud-backend。
          env:
            - name: NS_BACKEND_HOST
              value: {{ include "nexussky.cloudBackendFullname" . | quote }}
            - name: NS_BACKEND_PORT
              value: {{ .Values.cloudBackend.port | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.gcsWeb.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.gcsWeb.resources | nindent 12 }}
          # readOnlyRootFilesystem 下 nginx 需可写的 pid 与临时目录，否则
          # mkdir() "/var/cache/nginx/client_temp" failed: Read-only file system
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

