# PodDisruptionBudget: cloud-backend + gcs-web
# 保证至少 minAvailable 个副本可用
# cloud-backend 默认关闭（单副本时 minAvailable>=1 会阻塞 drain）——见 values.yaml cloudBackend.pdb.enabled
{{- if .Values.cloudBackend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexussky.cloudBackendFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cloud-backend
spec:
  minAvailable: {{ .Values.cloudBackend.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cloud-backend
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexussky.gcsWebFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gcs-web
spec:
  minAvailable: {{ .Values.gcsWeb.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gcs-web
