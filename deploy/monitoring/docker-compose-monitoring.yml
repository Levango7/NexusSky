# NexusSky 监控栈一键启动
# 用法：docker compose -f deploy/monitoring/docker-compose-monitoring.yml up -d
# 包含：Prometheus + Grafana + Alertmanager + Loki + Promtail
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexussky-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertmanager-rules.yaml:/etc/prometheus/alertmanager-rules.yaml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - nexussky-monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nexussky-alertmanager
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - nexussky-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: nexussky-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/nexussky-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=nexussky
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/nexussky-dashboard.json
    ports:
      - "3000:3000"
    networks:
      - nexussky-monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.5
    container_name: nexussky-loki
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yaml'
    ports:
      - "3100:3100"
    networks:
      - nexussky-monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.5
    container_name: nexussky-promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yaml'
    networks:
      - nexussky-monitoring
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:

networks:
  nexussky-monitoring:
    driver: bridge
