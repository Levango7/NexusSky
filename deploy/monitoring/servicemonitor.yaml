# NexusSky ServiceMonitor CRD (Prometheus Operator)
# 用法：kubectl apply -f deploy/monitoring/servicemonitor.yaml -n nexussky
# 前提：集群已安装 Prometheus Operator（kube-prometheus-stack）
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloud-backend-monitor
  namespace: nexussky
  labels:
    app.kubernetes.io/name: nexussky
    app.kubernetes.io/component: cloud-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nexussky
      app.kubernetes.io/component: cloud-backend
  namespaceSelector:
    matchNames:
      - nexussky
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
