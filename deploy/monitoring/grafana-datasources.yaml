# Grafana 数据源自动供给（挂载到 /etc/grafana/provisioning/datasources/）。
# dashboard JSON 的面板固定引用 uid=prometheus（type prometheus），日志侧用 Loki。
# 此前无任何 datasource 供给：Grafana 空库启动，面板全部 "datasource not found"。
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
