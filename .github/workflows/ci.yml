name: CI

on:
  push:
    branches: [ main, master ]
    # 2026-10-17 补。此前打 tag 不触发任何 CI——实测四个发布 tag 指向的 commit
    # （v1.0.2 afb5902 / v1.0.3 1e6095c / v1.0.4 cd66696 / v1.0.5 973db62）
    # 在最近 100 条 run 里**一条都没有**，即这四个 tag 指向的代码从未被门禁验证过：
    # 它们的质量信号只来自"之前某次 master 或 PR push 恰好碰到同一段代码"，
    # 而 tag 自己那次提交（以及它可能引入的新问题）没有任何结论。
    #
    # 补上之后每个 v* tag 都会跑完整门禁。tag 上会发生什么，逐条核过：
    #   * 4 个 tag 都是**附注 tag**（git cat-file -t == tag）⇒ push 事件的
    #     github.ref 是 refs/tags/vX.Y.Z，不是 refs/heads/*。
    #   * `pr-lint` 的 job 级 if 是 `github.event_name == 'pull_request'`
    #     ⇒ tag push 上自动跳过，不会误判标题格式。
    #   * docker-build **job 本身照常跑**（保留"能否构建"这一层价值），
    #     但它的 Login 与 Push 两**步**各带
    #     `github.ref == 'refs/heads/master'` 守卫 ⇒ tag 引用下跳过，
    #     **不会**往注册表写任何东西；metadata 的 `latest` 标签同样被守卫住。
    #   * 其余 job 的 if 只依赖 always()/failure()/缓存命中，与 ref 无关，照跑。
    #
    # 只认 v* 前缀：非版本 tag 不该拖起 20+ 个 job。
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

# 2026-10-06 补。此前同分支连续推送会各自起一整套 16 job 的 run，互不取消：
# 一次 push 之后紧跟 amend 是常见节奏，于是后一次 run 在前一次还占着 runner 时
# 又起 16 个 job——排队时间比构建时间还长，且旧 run 的结论毫无价值。
# cancel-in-progress 只取消**同 ref 未完成**的 run：master 上 push 会取消前一个
# 未完成的 master run（其结论已过期），而 PR 上的 run 不受其他 ref 影响。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# 2026-10-16 把 runner 镜像钉死到 ubuntu-24.04。
# GitHub 的 notice：ubuntu-latest 会在 2026-10-19 切到 Ubuntu 26（换 glibc/JDK/Node
# 默认版本）。ci.yml 下面 21 个 job 原本全是 ubuntu-latest，届时会整批翻车。
# 已从 #89 的 run 日志确认 ubuntu-latest **当前**就是 Ubuntu 24.04
# （runner-images/blob/ubuntu24/.../Ubuntu2404-Readme.md），所以钉到 24.04 是
# 环境零变化，只是不再跟标签漂。不要改回 ubuntu-latest；要升 26 请单独一个 PR
# 全量验证后再动。
#
# 同批把 actions/setup-java@v4 -> @v5（v4 已 deprecated，不再收更新）。
# checkout/cache/setup-node/upload-artifact@v4 都是当前大版本，未动。
jobs:
  pr-lint:
    name: PR Title Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-gates:
    name: Repository gates (hygiene / self-test coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 这两道门禁是把"别再犯"变成机械检查的产物：
      #   ① 仓库卫生 —— 合并冲突标记 / CHANGELOG 自相矛盾 / 构建产物入库，
      #      这三类静默损坏会让别的门禁"看着在工作、其实核的是错的行"；
      #   ② 自测覆盖 —— 提供了 --self-test 的脚本必须真有 CI job 跑它。
      #      真事：coord-status.sh 的自测就在仓库里，却没人跑，它的守卫坏了 8 天。
      # 每个门禁先跑自己的 --self-test（用合成夹具证明它能拦真事故、不误拦干净态），
      # 再跑真检查。先证明工具可信，再信它的结论——
      # 2026-10-20 这一轮里，我的工具错了四次（每次都差点让我去「修」一段好代码）。
      - name: Self-test the gates themselves
        run: |
          python3 scripts/check-repo-hygiene.py --self-test
          python3 scripts/check-selftest-coverage.py --self-test
          python3 scripts/check-revert-looking-diff.py --self-test
          python3 scripts/check-claimed-endpoint-count.py --self-test
      - name: Repository hygiene gate (no conflict markers / self-consistent CHANGELOG)
        run: python3 scripts/check-repo-hygiene.py
      - name: Self-test coverage gate
        run: python3 scripts/check-selftest-coverage.py
      # 文档里对外声称的端点数，必须等于代码里的实际数。
      # 2026-10-20 实测：同一件事在文档里有三个不同的数（358 / 345 / 345），而实测是 406。
      - name: Claimed endpoint count gate
        run: python3 scripts/check-claimed-endpoint-count.py
      # 下面两个是 2026-10-20 被「自测覆盖门禁」当场抓出来的：它们的 --self-test
      # 从来没在 CI 里跑过（mavlink 编解码一致性 / SITL 离线自检，都是离线的、很快）。
      - name: MAVLink codec self-test (offline)
        run: python3 scripts/mavlink-compatibility-check.py --self-test
      - name: SITL compatibility offline self-test
        run: bash scripts/sitl-compatibility-test.sh --self-test-only
      # 手机摄像头链路的「取图端点探测」也要有自测。
      # 为什么：这条链路是"真机验证"硬件闭环的入口，探测逻辑一旦坏掉（或者退化成
      # 只认某条写死的路径），后面所有断言都在核一个错的 URL，却照样能"跑通"。
      # 这个自测用合成的假 IP 摄像头证明：能发现设备**自己首页里声明**的端点、
      # 会跳过 multipart 视频流、会拒绝「头两字节像 JPEG」的假响应。
      - name: Phone camera discovery self-test (offline)
        run: python3 scripts/e2e-phone-camera.py --self-test

  dep-gate:
    name: Dependency Version Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install xml parser deps
        # 仅用标准库，无需额外依赖；此步留作未来扩展（如 lxml）的挂载点
        run: python -c "import xml.etree.ElementTree as ET; print('stdlib ok')"
      - name: Dependency version gate
        # 三查：① 硬编码版本（应走 ${xxx.version}）② 同一 artifactId 版本分裂
        # ③ docs/dependency-management.md 台账与 pom 实际值同步。
        # 为什么单列一个 job：纯静态检查、秒级完成，不必等 java 编译，早失败早反馈。
        run: python3 scripts/check-dependency-versions.py
      - name: Maven incantation gate
        # 检查文档/脚本里的 `mvn -pl` 是否漏 `-am`——漏了会静默使用 m2 陈旧制品，
        # 让开发者看到与改动无关的假失败（本仓曾因此误判两轮）。
        run: python3 scripts/check-maven-incantations.py
      - name: Java level declaration gate
        # 只查「声明层」一致性：各模块 pom 的有效编译级别是否自洽
        # （release/source 混用、继承覆盖等），不需要已编译产物。
        # 产物字节码核对在 java-level 作业里做（那里才有 target/classes）。
        run: python3 scripts/check-java-level.py --list
      - name: Self-test the SPI gate itself
        # 离线夹具自证六情形（未验无豁免→1 / 豁免未到期→0 / 到期→1 / 可撤销→1 /
        # 一个实现都没扫到→2 / 僵尸豁免→1）。放在真跑之前：判据自己坏掉时最早暴露，
        # 而不是等到某天"全绿"却其实一直在跳过。
        run: python3 scripts/check-spi-coverage.py --self-test
      - name: SPI verifiability gate
        # 通往外部世界的适配器（监管上报、厂商网关、传输、传感器源）必须有测试点名它。
        # 2026-10-12 首跑实测：13 个 SPI 接口 / 35 个生产实现 / **9 个在全部测试源码里
        # 一次都没出现**（含 UomReportSink、MavlinkDeviceGateway、5 个 ModuleAdapter 实现）。
        # 这类代码编译通过、启动正常，但没有一条断言钉过——缺陷只会在真机/真平台暴露。
        # 例外走豁免账：必须写理由 + 到期日，到期即红，不许悄悄续期（见脚本 docstring）。
        run: python3 scripts/check-spi-coverage.py

  java-upward-compat:
    name: Java 26 Upward Compatibility (compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Compile with JDK 26
        # 只跑 compile，不跑 test：JDK 26 是非 LTS（2027-03 EOL），不作为生产基线。
        # 它的价值是「预警器」——提前发现未来 JDK 会破坏构建的用法。
        # 不跑 test 是刻意的：字节码增强类工具（JaCoCo agent / Mockito inline mock）
        # 在新 JDK 上可能失败，那是工具问题而非本仓代码问题，会制造噪声失败。
        run: mvn -B clean compile -DskipTests

  java-level:
    name: Java Level Gate (bytecode vs declaration)
    needs: [maven-warm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Compile all modules
        # 经 ci-mvn-retry.sh：命中"取件类"失败时先由 runner 自己回查中央仓并把状态码打进日志，
        # 再重试一次；测试失败/编译错误一律不重试。缘由见该脚本头部（本 job 曾在 2026-10-13
        # 报 junit-bom:5.11.4 "absent"，而同一时刻本机 curl 同一 URL 是 200——光看日志分不出
        # 是坐标错还是这个 runner 的通路坏）。
        run: bash scripts/ci-mvn-retry.sh -B clean compile -DskipTests
      - name: Java level gate (bytecode must match declaration)
        # 读各模块 target/classes 首个 class 的 major version，与 pom 声明的有效级别比对，
        # 并检查产物新鲜度（class 不得早于 pom.xml）。
        # 为什么必须有这个作业：sdk-java 曾声明 Java 11、实际产出 Java 17，
        # 构建全绿、测试全绿、文档也"写对了"，只有客户在 JDK 11 上才炸。
        run: python3 scripts/check-java-level.py

  maven-warm:
    name: Warm Maven Cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # actions/cache 对同一 key「首个保存者胜出」，其余 job 的保存全部被跳过
      # （日志实证：Cache hit occurred on the primary key ..., not saving cache）。
      # 若由并行构建 job 抢占，最先完成的小模块会把残缺 m2 冻结进缓存，
      # 导致每个 maven job 每次运行都实时下载数百 artifact（单 job 实测 740 次
      # Downloading from central），在共享 runner IP 上触发 Maven Central 429。
      # 本作业先于全部 maven job 运行：冷缓存时成为唯一保存者（完整 m2）；
      # 命中时以离线构建校验缓存完整性（-o 下任何缺失立刻失败而非静默回源）。
      - name: Check cache key sites are consistent
        run: bash scripts/ci-maven-cache-key.sh
      - name: Restore Maven local repository
        id: mvn-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Populate local repository (cold cache)
        if: steps.mvn-cache.outputs.cache-hit != 'true'
        run: mvn -B -DskipTests verify
      # 命中缓存时的完整性自检。原形态「-o 一缺就判红」的代价：runner 自带的 Maven 一换默认
      # 插件版本集合（本仓从不显式钉 maven-resources-plugin 这类），缓存里就没有那一版，离线
      # 自检必挂；而 actions/cache 对已存在的同键不再保存 ⇒ master 与所有 PR 一起冻在红上。
      # 实证（2026-10-07）：键 …-v1 从 15:53Z 起在 master run 37647669688、PR #6 run
      # 37647663158、PR #7 run 37655262825 三处红在同一行 Cannot access central ... in
      # offline mode；而同一键 139,866,841 B 那版当天 12:55Z（run 37624477248）离线自检通过
      # ⇒ 变的是工具链不是 pom（键里没掺 Maven 版本，所以键不动、缓存也不覆盖）。
      # 现在：自检失败 ⇒ 打警告并在线补齐，当次运行继续走完；真正换代由键尾 v 号显式抬升，
      # 上面那步守卫保证所有站点同源（防"只改一处"）。
      - name: Verify cached repository is complete (offline build)
        if: steps.mvn-cache.outputs.cache-hit == 'true'
        run: |
          echo "toolchain: $(mvn -version | head -1)"
          if mvn -B -o -DskipTests verify; then
            echo "m2 缓存对当前工具链完整"
          else
            echo "::warning::离线自检失败（多为 runner 的 Maven 代次换了默认插件版本）⇒ 本次在线补齐；请抬 ci.yml 键尾 v 号重开一代缓存"
            mvn -B -DskipTests verify
          fi

  java:
    name: Java ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [ maven-warm ]
    strategy:
      fail-fast: false
      matrix:
        module: [ mavlink-core, drone-sim, cloud-backend, link-sim, sdk-java, regulator-sim ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build & test
        # 见 scripts/ci-mvn-retry.sh 头部：取件类失败带取证重试一次，真红不重试。
        run: bash scripts/ci-mvn-retry.sh -B -pl ${{ matrix.module }} -am package
      - name: Upload surefire reports (docs test-count gate input)
        # 文档口径门禁（docs-test-count job）的输入：surefire XML 是测试数的唯一权威来源。
        # if-no-files-found: error——缺 TEST-*.xml 说明测试根本没跑，必须红而不是静默通过。
        # 路径按本 matrix 模块限定：-am 会连带构建依赖模块，但它们的报告归属各自的 matrix 项。
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          retention-days: 3
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        # if-no-files-found 默认 warn：模块没有 jacoco 产物时上传会静默"成功"，
        # 与本 job 的覆盖率门禁语义相符——缺产物就是故障，不是可跳过的美化步骤。
        with:
          if-no-files-found: error
          name: jacoco-report-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/
          retention-days: 14
      - name: Coverage gate (jacoco check; BUNDLE LINE >= per-module threshold)
        # 阈值不在本文件里，而在各模块 pom 的 jacoco check 规则中：
        #   mavlink-core 0.65 / drone-sim 0.70 / link-sim 0.65 / cloud-backend 0.65
        #   sdk-java 0.35 / regulator-sim 0.70
        # 每个阈值 = 该模块实测 LINE 覆盖率向下取整到 5%（见 scripts/ci-coverage-threshold.sh）。
        # jacoco:check 在 <module>/target/jacoco.exec 缺失时会打一条 warn 后**直接跳过**
        # （-DskipTests / pom 漏配 prepare-agent 都会导致这种"假绿"），
        # 所以先显式断言产物存在，缺文件立刻红而不是空转。
        run: |
          if [ ! -f "${{ matrix.module }}/target/jacoco.exec" ]; then
            echo "::error::${{ matrix.module }} 缺少 target/jacoco.exec —— 覆盖率门禁本次会被 jacoco 静默跳过"
            ls -la "${{ matrix.module }}/target/"
            exit 1
          fi
          mvn -B -pl ${{ matrix.module }} -am verify -DskipTests

      - name: Coverage threshold consistency (pom declared == measured policy floor)
        # 上一行是"够不够阈值"，这一行是"三处声明是否互相自洽"：pom 的 <minimum>、本文件
        # 上面的注释表、scripts/ci-coverage-threshold.sh 的 POLICY 口径（实测 LINE 向下取整
        # 到 5%）。此前这条只能人工跑 --strict，下调 pom 阈值却忘了同步文档不会有任何信号。
        # 只查本 matrix 项的模块：-am 会顺带构建依赖模块，但它们的 jacoco.xml 不保证存在，
        # 不带参数全量跑会在依赖模块上误报"缺产物"。
        run: bash scripts/ci-coverage-threshold.sh --strict ${{ matrix.module }}

  docs-test-count:
    name: Docs test-count gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [ java, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the gate itself
        # 门禁自己也得被证明有效，否则它只是另一个"看起来在检查"的东西。
        # 2026-10-08 事故：master 上多份文档带着误提交的 merge 冲突标记，冲突块恰吞掉
        # 测试规模表，test_table_rows() 认不出表格行 => 逐格核对被静默跳过 =>
        # 门禁输出"全部一致"，而表已损坏、该核对的数字一个都没核。
        # 此后 check-test-count-docs.py 增加冲突标记检出，这里用离线夹具证明它真的会红。
        # 无需 surefire 产物，放在下载之前，坏了最早暴露。
        run: python3 scripts/check-test-count-docs.py --self-test
      - name: Download surefire reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: surefire-reports
      - name: Align module directory names
        # download-artifact v4 把每个 artifact 放进以其名字命名的子目录
        # （surefire-cloud-backend/），而门禁脚本按 <reports-root>/<module>/TEST-*.xml
        # 取模块名——去掉 surefire- 前缀对齐。
        run: |
          cd surefire-reports
          for d in surefire-*; do
            mv "$d" "${d#surefire-}"
          done
          ls .
      - name: Download vitest json report
        # 2026-10-06 补：门禁此前只读 surefire XML，即只管 Java。前端用例数没有任何
        # 约束力——README 的「168 例」已过期到 177 例却长期无人发现，与 Java 侧
        # 「3230 过期两年多」是同一个根因：加测试不会让文档过期这件事变红。
        # 这里下载 frontend job 那次 vitest 的 JSON 报告，不为门禁重跑一遍前端测试。
        uses: actions/download-artifact@v4
        with:
          name: vitest-report
          path: gcs-web
      - name: Docs test-count gate
        # README/ROADMAP/whitepaper 等口径文档声称的单测数与 surefire 实测必须一致，
        # 数字漂移即红——权威来源是 XML，不是文档。
        # --frontend-json 追加前端一侧，用 vitest 自己的 numTotalTests 作权威值
        # （刻意不用静态数 `it(`：循环生成的用例数不等于文本出现次数）。
        run: >-
          python3 scripts/check-test-count-docs.py
          --reports-root surefire-reports
          --frontend-json gcs-web/vitest-report.json
  sdk-python:
    name: SDK Python (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package + pytest
        run: pip install -e . pytest
      - name: Run pytest
        # 覆盖率数字暂不设阈值（与 Java 侧不同：Python 侧还没有基线，
        # 先有信号再谈门槛，避免一个假数字门禁挡住后续提交）。
        run: python -m pytest tests/ -q

  frontend:
    name: GCS Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm install
      - name: ESLint check
        run: npm run lint
# 2026-10-01 建立：前端此前零测试（后端 3869 例 vs 前端 0），
      # 任何回归静默发布。现由 vitest 把「选中高亮死代码」「遥测曲线混机」
      # 「危险飞行命令无确认」三类已确认缺陷钉成红线。
      # 2026-10-04 合并第二批（72 例组件逻辑测试）后仍为同一道门禁。
      # 放在 lint 之后、build 之前：测试失败比构建失败更早暴露逻辑问题。
      - name: Unit tests (vitest)
        # test:ci = test + JSON 报告。JSON 供 docs-test-count job 核对文档里的
        # 前端用例数声称——与 surefire XML 对 Java 侧是同一个角色。
        run: npm run test:ci
      - name: Upload vitest json report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          # 文件名**刻意不以点开头**：upload-artifact@v4 默认 include-hidden-files: false，
          # 点开头的文件会被静默排除，本步随即 if-no-files-found: error 判红
          # （实测 run 37535480620：报告已写到 gcs-web/.vitest-report.json，上传仍报
          # "No files were found with the provided path"，并把 needs 它的
          # Docs test-count gate / Security Scan 一起拖成 skipped）。
          # 要改名请保持无前导点，或显式传 include-hidden-files: true。
          path: gcs-web/vitest-report.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run build

  # CI7 后半边：Playwright 真浏览器 E2E。
  # 与 frontend job 分开的原因：这里需要 JDK17 + 后端/模拟器 jar（两个 Java 进程），
  # 而 frontend job 只要 Node；混在一起会让"前端单测红"和"端到端红"两种语义挤在一处日志里。
  gcs-e2e:
    name: GCS Web E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: mvn-${{ runner.os }}-
      - name: Build backend + drone-sim jars
        # 覆盖 job 级 defaults.run.working-directory（gcs-web）：本步必须在仓库根跑 Maven，
        # 否则 mvn -pl cloud-backend 会因 gcs-web/ 下没有 pom.xml 直接报
        # "Could not find the selected project in the reactor: cloud-backend" 并退出。
        working-directory: ${{ github.workspace }}
        run: mvn -B -q -pl cloud-backend,drone-sim -am package -DskipTests
      - run: npm install
      # 浏览器本体单独缓存：每次重下 ~150MB，CI 时长直接翻倍
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gcs-web/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # 起后端 + 跑测试 + 清理收在同一个 step：GitHub Actions 每个 run 是独立 shell，
      # 用 `&` 起的进程会随 step 结束被回收，后端活不到测试那一步
      #（症状是连接被拒，很难第一眼归因）。逻辑抽到 e2e/ci-run.sh，本地 `bash e2e/ci-run.sh`
      # 跑的是同一份代码。
      - name: Playwright E2E
        run: bash e2e/ci-run.sh
        env:
          AF_JAVA: ${{ env.JAVA_HOME_17_X64 }}/bin/java
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            gcs-web/playwright-report/
            gcs-web/test-results/
            gcs-web/.e2e-logs/
          retention-days: 7

  ui-audit:
    name: UI Audit (Headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm install
      - name: Build frontend bundle
        run: npm run build
      # 预览服务与审计收在同一个 step：GitHub Actions 每个 run 是独立 shell，
      # 上一步 & 起的进程会随 step 结束被回收（2026-10-04 在起后端时踩过，
      # 症状是连接被拒、难归因）。
      # 无后端模式（UI_AUDIT_OFFLINE=1）：请求落 404，面板呈空/错状态——
      # 要审的（浅色控件残留 / JS 错误 / 顶栏高度）在无数据时同样成立，
      # 且空状态本身就在被审面内。
      # 浏览器用 ubuntu-latest 预装的系统 Chrome（channel:'chrome'，
      # 不下载 Playwright 浏览器）；视图取覆盖四类布局的子集（全 45 约 6 分钟，
      # job 预算不值），移动端 4 视图同跑。
      - name: Serve preview + audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          UI_BASE=http://127.0.0.1:4173 UI_AUDIT_OFFLINE=1             UI_AUDIT_VIEWS=control,dashboard,dock,sensing,roc,opsreport,defect,fleetops             node scripts/ui-audit.mjs
          RC=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $RC

  e2e-smoke:
    name: E2E smoke + fault + failsafe + vision
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [ java, frontend ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Normal flight smoke (sim -> mission -> RTL + flightlog + joystick)
        run: |
          # C5 第一步：让 CI 的每次 flight e2e 都走"签名帧"通路（后端仍未验签）。
          # 密钥运行时生成、不落字面量——这里要证的只是"带 13 字节签名块的帧能正常
          # 穿过 UDP/Parser/CRC 不被破坏"，密钥取值无关；后端 mavlink.signing.enabled
          # 仍为 false ⇒ isSigningEnabled() 短路，不会验签也不会拒签。
          SIM_SIGNING_KEY="$(openssl rand -hex 16)"
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar \
            --signing-key "$SIM_SIGNING_KEY" &
          sleep 5
          bash scripts/e2e-smoke.sh
      - name: Fault-injection regression (gps-loss / battery-fault / link-loss)
        run: bash scripts/e2e-fault-linux.sh
      - name: Failsafe regression (link-loss mid-mission -> auto RTL)
        run: bash scripts/e2e-failsafe-linux.sh
      - name: Vision regression (camera session -> capture -> orbit -> tracks)
        run: bash scripts/e2e-vision-linux.sh

# CI 能力腿（2026-10-06 新增）：把已有 Linux 版脚本接进门禁。
  #
  # 为什么单独一个 job 而不加进 e2e-smoke：两者故障语义不同——
  #   e2e-smoke 是**安全回归**（故障注入 / failsafe / 感知），红了必须立刻阻塞；
  #   本 job 是**能力演示**（空地应急 / 喷洒物流 / 硬件抽象），红的原因往往是编排脆弱
  #   而非能力缺失。混在一起会连带把更有价值的安全回归一起拖红。
  #
  # 关于 continue-on-error：本 job **从不带 job 级 continue-on-error**，它是硬门禁。
  # 历史：能力腿原是 e2e-smoke 里的一个 **step**（带 step 级 continue-on-error，观察模式），
  # 后来拆成独立 job 时继承了硬门禁，但这段注释留了下来 —— 它描述的
  # 是已经不存在的状态，当时下一个看的人会找不到那个 continue-on-error。
  e2e-capability:
    name: E2E capability (emergency / spray / hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [ java ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build backend + sim
        run: mvn -B -DskipTests package -pl cloud-backend,drone-sim -am
      - name: Start backend + drone-sim
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::backend failed to become ready within 120s"
              exit 1
            fi
            sleep 2
          done
          # --actuators 必须带：SprayPump / Gripper 默认不注入
          # （VirtualDrone 构造器 actuatorsEnabled=false ⇒ 两者为 null），
          # 于是 MAV_CMD 30083/30084/30085 的处理器一律返回 MAV_RESULT_UNSUPPORTED，
          # e2e-spray 的机载回执恒为 result=-1 —— 演示时看到的是"命令被拒"。
          # 该 flag 是 M2 执行机构（FR-01）的显式开关，见 SimConfig#parse 的 "actuators" 分支。
          # --lidar / --imu 同理：注入 SimulatedLiDARSource / SimulatedImuSource，
          # 否则 /api/v1/lidar/data、/api/v1/imu/data 恒 404（FR-21 / FR-22）。
          # --signing-key：C5 第一步，让三条能力腿也走签名帧通路（密钥运行时生成，
          # 不落字面量；后端未开验签，取值为无关项）。见本文件 415 行附近的同款说明。
          SIM_SIGNING_KEY="$(openssl rand -hex 16)"
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar \
            --actuators --lidar --imu --signing-key "$SIM_SIGNING_KEY" &
          # 等 sim 注册上来：后三个脚本都以 sysid=1 在线为前置
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/drones 2>/dev/null | grep -q '"sysid":1'; then
              echo "drone registered (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::warning::drone-sim did not register within 60s; capability legs may self-skip"
      # 硬门禁：三条腿任一失败即 job 变红（2026-10-07 由观察模式转正）。
      # 转正依据：三腿在 WSL2 真 Linux 本地连续两次全绿（emergency 31 / spray 20 /
      # hardware 16，67 项断言 0 失败），且 CI run 37624477248 上 25/25 全绿。
      #
      # 步骤名必须加引号：未加引号的标量里出现「冒号+空格」会被 YAML 解析成映射而报错。
      # 每条腿仍 tee 到 /tmp 并落盘退出码 —— 汇总步骤用它出表，
      # 这样即使将来某条腿失败，也能一眼看出是哪条、失败在哪一步。
      - name: "Air-ground emergency workflow (deploy -> alarm -> linkage -> dispatch)"
        run: |
          set -o pipefail
          bash scripts/e2e-emergency.sh 2>&1 | tee /tmp/leg-emergency.log
          echo "${PIPESTATUS[0]}" > /tmp/rc-emergency
      - name: "Spray + logistics chain (task -> status -> control -> delivery)"
        run: |
          set -o pipefail
          bash scripts/e2e-spray.sh 2>&1 | tee /tmp/leg-spray.log
          echo "${PIPESTATUS[0]}" > /tmp/rc-spray
      - name: "Hardware abstraction (radar -> rotor -> lidar -> imu)"
        run: |
          set -o pipefail
          bash scripts/e2e-hardware.sh 2>&1 | tee /tmp/leg-hardware.log
          echo "${PIPESTATUS[0]}" > /tmp/rc-hardware
      - name: Capability legs summary
        if: always()
        run: |
          {
            echo "## 能力腿汇总"
            echo
            echo "| 腿 | 结果 |"
            echo "|---|---|"
            overall=0
            for leg in emergency spray hardware; do
              rc="$(cat /tmp/rc-$leg 2>/dev/null || echo 999)"
              if [ "$rc" = "0" ]; then
                echo "| $leg | ✅ 通过 |"
              else
                echo "| $leg | ❌ 失败 (exit $rc) |"
                overall=1
              fi
            done
            echo
            echo "> 三条腿为**硬门禁**：任一失败即本 job 变红（2026-10-07 由观察模式转正）。"
            echo "> 完整日志见上方各步骤输出。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$overall" != "0" ]; then
            echo "::error::能力腿存在失败，详见 job summary"
            exit 1
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [java]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Pass C（prod profile + 真实 PostgreSQL）用：验证 Flyway 迁移在 PG 上
      # 从零建库 + Hibernate ddl-auto=validate 逐实体校验。此前该通路从未被任何
      # CI job 覆盖（integration 一直只跑 dev profile + H2），迁移里 MySQL 方言
      # 的 DDL 直到上线才会暴露。库名/用户名与 application-prod.properties 默认值
      # 一致（localhost:5432/aerofleet_prod），脚本只需注入密码环境变量。
      postgres:
        image: mirror.gcr.io/library/postgres:15-alpine
        env:
          POSTGRES_DB: aerofleet_prod
          POSTGRES_USER: aerofleet
          POSTGRES_PASSWORD: ci_pg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerofleet -d aerofleet_prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Run integration tests
        run: |
          chmod +x scripts/ci-integration-test.sh
          scripts/ci-integration-test.sh

      - name: Integration tests under a non-UTC deployment timezone
        # 这条腿是 V29 那个缺陷的**证伪测试**，不是重复劳动。
        # 症状：flight_log 的显式批量写路径过去不带目标类型地绑定 java.sql.Timestamp
        #   ⇒ pgjdbc 按 **JVM 默认时区**把绝对时刻摊成"无时区墙钟"写进 timestamp 列；
        #   而读侧走 Hibernate 的 Instant 映射，它固定按 **UTC** 渲染边界。
        #   两边口径不同 ⇒ +08 部署上"当天的飞行历史"读到空，`day=明天` 才看得见。
        # runner 是 UTC ⇒ 默认时区==UTC ⇒ 两侧恰好抵消 ⇒ **只有把时区钉成非 UTC 才会红**。
        # 修复前的复现证据（本机 +08，真 PG）：真库确有 65 行 sysid=231 遥测，
        #   GET /api/v1/flightlog?day=<今天> → []，?day=<明天> → 65 行。
        #
        # 为什么前面要先重建库：断言 7 是"轮询 flight_log 里 sysid=231 的行数 ≥3"。
        # 若沿用上一趟留下的库，上一趟写的行还在表里 ⇒ **本趟就算全错也能读到 ≥3 行**，
        # 这条腿会退化成"永远绿"。所以先terminate+drop+create，逼它从零验一遍
        # （顺带把 V29 在非 UTC 会话时区下再跑一次完整建库）。
        # Java 在 Linux 上读 TZ 环境变量决定默认时区；不改任何脚本默认值。
        env:
          TZ: Asia/Shanghai
        run: |
          psql "postgresql://aerofleet:ci_pg_password@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='aerofleet_prod' AND pid <> pg_backend_pid()" \
            -c "DROP DATABASE IF EXISTS aerofleet_prod" \
            -c "CREATE DATABASE aerofleet_prod OWNER aerofleet"
          bash scripts/ci-integration-test.sh


