name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  pr-lint:
    name: PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-warm:
    name: Warm Maven Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # actions/cache 对同一 key「首个保存者胜出」，其余 job 的保存全部被跳过
      # （日志实证：Cache hit occurred on the primary key ..., not saving cache）。
      # 若由并行构建 job 抢占，最先完成的小模块会把残缺 m2 冻结进缓存，
      # 导致每个 maven job 每次运行都实时下载数百 artifact（单 job 实测 740 次
      # Downloading from central），在共享 runner IP 上触发 Maven Central 429。
      # 本作业先于全部 maven job 运行：冷缓存时成为唯一保存者（完整 m2）；
      # 命中时以离线构建校验缓存完整性（-o 下任何缺失立刻失败而非静默回源）。
      - name: Restore Maven local repository
        id: mvn-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Populate local repository (cold cache)
        if: steps.mvn-cache.outputs.cache-hit != 'true'
        run: mvn -B -DskipTests verify
      - name: Verify cached repository is complete (offline build)
        if: steps.mvn-cache.outputs.cache-hit == 'true'
        run: mvn -B -o -DskipTests verify

  java:
    name: Java ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [ maven-warm ]
    strategy:
      fail-fast: false
      matrix:
        module: [ mavlink-core, drone-sim, cloud-backend, link-sim, sdk-java, regulator-sim ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build & test
        run: mvn -B -pl ${{ matrix.module }} -am package
      - name: Upload surefire reports (docs test-count gate input)
        # 文档口径门禁（docs-test-count job）的输入：surefire XML 是测试数的唯一权威来源。
        # if-no-files-found: error——缺 TEST-*.xml 说明测试根本没跑，必须红而不是静默通过。
        # 路径按本 matrix 模块限定：-am 会连带构建依赖模块，但它们的报告归属各自的 matrix 项。
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          retention-days: 3
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        # if-no-files-found 默认 warn：模块没有 jacoco 产物时上传会静默"成功"，
        # 与本 job 的覆盖率门禁语义相符——缺产物就是故障，不是可跳过的美化步骤。
        with:
          if-no-files-found: error
          name: jacoco-report-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/
          retention-days: 14
      - name: Coverage gate (jacoco check; BUNDLE LINE >= per-module threshold)
        # 阈值不在本文件里，而在各模块 pom 的 jacoco check 规则中：
        #   mavlink-core 0.65 / drone-sim 0.70 / link-sim 0.65 / cloud-backend 0.60
        #   sdk-java 0.35 / regulator-sim 0.70
        # 每个阈值 = 该模块实测 LINE 覆盖率向下取整到 5%（见 scripts/ci-coverage-threshold.sh）。
        # jacoco:check 在 <module>/target/jacoco.exec 缺失时会打一条 warn 后**直接跳过**
        # （-DskipTests / pom 漏配 prepare-agent 都会导致这种"假绿"），
        # 所以先显式断言产物存在，缺文件立刻红而不是空转。
        run: |
          if [ ! -f "${{ matrix.module }}/target/jacoco.exec" ]; then
            echo "::error::${{ matrix.module }} 缺少 target/jacoco.exec —— 覆盖率门禁本次会被 jacoco 静默跳过"
            ls -la "${{ matrix.module }}/target/"
            exit 1
          fi
          mvn -B -pl ${{ matrix.module }} -am verify -DskipTests

      - name: Coverage threshold consistency (pom declared == measured policy floor)
        # 上一行是"够不够阈值"，这一行是"三处声明是否互相自洽"：pom 的 <minimum>、本文件
        # 上面的注释表、scripts/ci-coverage-threshold.sh 的 POLICY 口径（实测 LINE 向下取整
        # 到 5%）。此前这条只能人工跑 --strict，下调 pom 阈值却忘了同步文档不会有任何信号。
        # 只查本 matrix 项的模块：-am 会顺带构建依赖模块，但它们的 jacoco.xml 不保证存在，
        # 不带参数全量跑会在依赖模块上误报"缺产物"。
        run: bash scripts/ci-coverage-threshold.sh --strict ${{ matrix.module }}

  docs-test-count:
    name: Docs test-count gate
    runs-on: ubuntu-latest
    needs: [ java ]
    steps:
      - uses: actions/checkout@v4
      - name: Download surefire reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: surefire-reports
      - name: Align module directory names
        # download-artifact v4 把每个 artifact 放进以其名字命名的子目录
        # （surefire-cloud-backend/），而门禁脚本按 <reports-root>/<module>/TEST-*.xml
        # 取模块名——去掉 surefire- 前缀对齐。
        run: |
          cd surefire-reports
          for d in surefire-*; do
            mv "$d" "${d#surefire-}"
          done
          ls .
      - name: Docs test-count gate
        # README/ROADMAP/whitepaper 等口径文档声称的单测数与 surefire 实测必须一致，
        # 数字漂移即红——权威来源是 XML，不是文档。
        run: python3 scripts/check-test-count-docs.py --reports-root surefire-reports

  frontend:
    name: GCS Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm install
      - name: ESLint check
        run: npm run lint
# 2026-10-01 建立：前端此前零测试（后端 3869 例 vs 前端 0），
      # 任何回归静默发布。现由 vitest 把「选中高亮死代码」「遥测曲线混机」
      # 「危险飞行命令无确认」三类已确认缺陷钉成红线。
      # 2026-10-04 合并第二批（72 例组件逻辑测试）后仍为同一道门禁。
      # 放在 lint 之后、build 之前：测试失败比构建失败更早暴露逻辑问题。
      - name: Unit tests (vitest)
        run: npm run test
      - run: npm run build

  # CI7 后半边：Playwright 真浏览器 E2E。
  # 与 frontend job 分开的原因：这里需要 JDK17 + 后端/模拟器 jar（两个 Java 进程），
  # 而 frontend job 只要 Node；混在一起会让"前端单测红"和"端到端红"两种语义挤在一处日志里。
  gcs-e2e:
    name: GCS Web E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: mvn-${{ runner.os }}-
      - name: Build backend + drone-sim jars
        run: mvn -B -q -pl cloud-backend,drone-sim -am package -DskipTests
      - run: npm install
      # 浏览器本体单独缓存：每次重下 ~150MB，CI 时长直接翻倍
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gcs-web/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # 起后端 + 跑测试 + 清理收在同一个 step：GitHub Actions 每个 run 是独立 shell，
      # 用 `&` 起的进程会随 step 结束被回收，后端活不到测试那一步
      #（症状是连接被拒，很难第一眼归因）。逻辑抽到 e2e/ci-run.sh，本地 `bash e2e/ci-run.sh`
      # 跑的是同一份代码。
      - name: Playwright E2E
        run: bash e2e/ci-run.sh
        env:
          AF_JAVA: ${{ env.JAVA_HOME_17_X64 }}/bin/java
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            gcs-web/playwright-report/
            gcs-web/test-results/
            gcs-web/.e2e-logs/
          retention-days: 7

  e2e-smoke:
    name: E2E smoke + fault + failsafe + vision
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Normal flight smoke (sim -> mission -> RTL + flightlog + joystick)
        run: |
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar &
          sleep 5
          bash scripts/e2e-smoke.sh
      - name: Fault-injection regression (gps-loss / battery-fault / link-loss)
        run: bash scripts/e2e-fault-linux.sh
      - name: Failsafe regression (link-loss mid-mission -> auto RTL)
        run: bash scripts/e2e-failsafe-linux.sh
      - name: Vision regression (camera session -> capture -> orbit -> tracks)
        run: bash scripts/e2e-vision-linux.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [java]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Pass C（prod profile + 真实 PostgreSQL）用：验证 Flyway 迁移在 PG 上
      # 从零建库 + Hibernate ddl-auto=validate 逐实体校验。此前该通路从未被任何
      # CI job 覆盖（integration 一直只跑 dev profile + H2），迁移里 MySQL 方言
      # 的 DDL 直到上线才会暴露。库名/用户名与 application-prod.properties 默认值
      # 一致（localhost:5432/aerofleet_prod），脚本只需注入密码环境变量。
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aerofleet_prod
          POSTGRES_USER: aerofleet
          POSTGRES_PASSWORD: ci_pg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerofleet -d aerofleet_prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Run integration tests
        run: |
          chmod +x scripts/ci-integration-test.sh
          scripts/ci-integration-test.sh

  sdk-integration:
    name: SDK Integration E2E
    runs-on: ubuntu-latest
    needs: [ java ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Start drone-sim
        run: |
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar &
          sleep 5
      - name: SDK integration tests
        run: |
          chmod +x scripts/e2e-sdk-integration.sh
          bash scripts/e2e-sdk-integration.sh
      - name: Docker Compose E2E (if Docker available)
        continue-on-error: true
        run: |
          if command -v docker-compose &>/dev/null; then
            chmod +x scripts/e2e-docker-compose.sh
            bash scripts/e2e-docker-compose.sh
          else
            echo "docker-compose not available, skipping"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - name: Frontend dependency audit
        working-directory: gcs-web
        # 不带 --production/--omit=dev：必须把 devDependencies 一起扫。
        # 原写法用 --production 把 vite/esbuild 这类构建期/开发期依赖整体滤掉，
        # 实测退出码 0，而同一份 lockfile 全量扫描是 1（vite<=6.4.2 high）。
        # 这不是理论风险：docker-compose.yml:29 就是用 `npm run dev -- --host 0.0.0.0`
        # 把 Vite dev server 直接暴露到宿主机网卡，dev 依赖链上的漏洞就是在线攻击面。
        run: npm audit --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Pre-populate local Maven repository (Trivy offline dependency resolution)
        continue-on-error: true
        run: mvn -B -q dependency:go-offline
      - name: Trivy filesystem scan
        # 固定到发布 tag v0.36.0，不再用 @master。理由（供应链）：
        #   @master 是浮动 ref——同一份 workflow 在不同日期会执行不同的 action 代码，
        #   上游合入任何改动（默认 scanners、退出码语义、内置 trivy 版本）都会在没有
        #   任何 PR 评审信号的情况下改变本仓库的安全门禁方向。实测：master 目前比
        #   v0.36.0 领先 11 个提交（含 "Update trivy to v0.74.0"），也就是说
        #   "今天跑的是哪个 trivy" 完全取决于上游当天合进了什么。
        # 注意：这是**有行为差异**的改动（tag 的内置 trivy 比 master 旧），
        # 本仓库无法本地跑 trivy（docker 镜像白名单 + avd/raw.githubusercontent 均被网关拦截），
        # 因此合并后的第一次 security-scan 运行就是这次改动的验收点。
        # 若想要"零行为差异 + 固定 ref"，把 uses 换成 master 当前 commit SHA：
        #   aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml
          # 0 → 只产 SARIF 不阻断（原状态：名义门禁）
          # 1 → 有发现直接让 job 变红；SARIF 仍然上传，用于看红因。
          # v0.36.0 实测语义修正（run 36647831204 红因 + action 源码
          # entrypoint.sh:76-83）：format=sarif 且未设 limit-severities-for-sarif
          # 时，action 会 **unset TRIVY_SEVERITY** —— 上面的 severity 入参在 SARIF
          # 模式下不生效，exit-code 1 对**任意**严重级的发现都判红（该次运行即被
          # 2 个 MEDIUM 触发）。当前保留这一更严语义：门禁 = 任意严重级的已知
          # 漏洞清零，SARIF 全量上传保证面板可见；若要还原"只拦 CRITICAL/HIGH"，
          # 加 limit-severities-for-sarif: true（代价：MEDIUM 不再进 SARIF/面板）。
          # trivy.yaml 的 scan.offline 保持不变（只影响 Maven 依赖解析不回源，
          # 不影响漏洞数据库下载与退出码语义）。
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        # always()：扫描步骤现在会因 CRITICAL/HIGH 直接判红，
        # 若不加这一条，SARIF 上传会被跳过，安全面板反而在最需要报告的运行里失去数据。
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [ maven-warm ]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java, javascript ]
    steps:
      - uses: actions/checkout@v4
      - name: Restore Maven local repository (restore-only; saves are owned by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [java, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: cloud-backend
            dockerfile: deploy/docker/Dockerfile.cloud
          - module: drone-sim
            dockerfile: deploy/docker/Dockerfile.sim
          - module: gcs-web
            dockerfile: deploy/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/levango7/nexussky-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
