name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  pr-lint:
    name: PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-warm:
    name: Warm Maven Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # actions/cache 对同一 key「首个保存者胜出」，其余 job 的保存全部被跳过
      # （日志实证：Cache hit occurred on the primary key ..., not saving cache）。
      # 若由并行构建 job 抢占，最先完成的小模块会把残缺 m2 冻结进缓存，
      # 导致每个 maven job 每次运行都实时下载数百 artifact（单 job 实测 740 次
      # Downloading from central），在共享 runner IP 上触发 Maven Central 429。
      # 本作业先于全部 maven job 运行：冷缓存时成为唯一保存者（完整 m2）；
      # 命中时以离线构建校验缓存完整性（-o 下任何缺失立刻失败而非静默回源）。
      - name: Restore Maven local repository
        id: mvn-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Populate local repository (cold cache)
        if: steps.mvn-cache.outputs.cache-hit != 'true'
        run: mvn -B -DskipTests verify
      - name: Verify cached repository is complete (offline build)
        if: steps.mvn-cache.outputs.cache-hit == 'true'
        run: mvn -B -o -DskipTests verify

  java:
    name: Java ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [ maven-warm ]
    strategy:
      fail-fast: false
      matrix:
        module: [ mavlink-core, drone-sim, cloud-backend, link-sim ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build & test
        run: mvn -B -pl ${{ matrix.module }} -am package
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/
          retention-days: 14
      - name: Coverage gate check (line >= 50%)
        run: mvn -B -pl ${{ matrix.module }} -am verify -DskipTests

  frontend:
    name: GCS Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm install
      - name: ESLint check
        run: npm run lint
      - run: npm run build

  e2e-smoke:
    name: E2E smoke + fault + failsafe + vision
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Normal flight smoke (sim -> mission -> RTL + flightlog + joystick)
        run: |
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar &
          sleep 5
          bash scripts/e2e-smoke.sh
      - name: Fault-injection regression (gps-loss / battery-fault / link-loss)
        run: bash scripts/e2e-fault-linux.sh
      - name: Failsafe regression (link-loss mid-mission -> auto RTL)
        run: bash scripts/e2e-failsafe-linux.sh
      - name: Vision regression (camera session -> capture -> orbit -> tracks)
        run: bash scripts/e2e-vision-linux.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [java]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Run integration tests
        run: |
          chmod +x scripts/ci-integration-test.sh
          scripts/ci-integration-test.sh

  sdk-integration:
    name: SDK Integration E2E
    runs-on: ubuntu-latest
    needs: [ java ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Start drone-sim
        run: |
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar &
          sleep 5
      - name: SDK integration tests
        run: |
          chmod +x scripts/e2e-sdk-integration.sh
          bash scripts/e2e-sdk-integration.sh
      - name: Docker Compose E2E (if Docker available)
        continue-on-error: true
        run: |
          if command -v docker-compose &>/dev/null; then
            chmod +x scripts/e2e-docker-compose.sh
            bash scripts/e2e-docker-compose.sh
          else
            echo "docker-compose not available, skipping"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - name: Frontend dependency audit
        working-directory: gcs-web
        run: npm audit --production --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Pre-populate local Maven repository (Trivy offline dependency resolution)
        continue-on-error: true
        run: mvn -B -q dependency:go-offline
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [ maven-warm ]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java, javascript ]
    steps:
      - uses: actions/checkout@v4
      - name: Restore Maven local repository (restore-only; saves are owned by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v1
          restore-keys: |
            mvn-${{ runner.os }}-
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [java, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: cloud-backend
            dockerfile: deploy/docker/Dockerfile.cloud
          - module: drone-sim
            dockerfile: deploy/docker/Dockerfile.sim
          - module: gcs-web
            dockerfile: deploy/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/levango7/nexussky-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max