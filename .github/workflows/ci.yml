name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  java:
    name: Java ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ mavlink-core, drone-sim, cloud-backend, link-sim ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test
        run: mvn -B -pl ${{ matrix.module }} -am package
      - name: Upload JaCoCo coverage report
        if: matrix.module == 'cloud-backend'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/
          retention-days: 14
      - name: Coverage gate check (line >= 50%)
        if: matrix.module == 'cloud-backend'
        continue-on-error: true
        run: mvn -B -pl ${{ matrix.module }} -am verify -DskipTests

  frontend:
    name: GCS Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-smoke:
    name: E2E smoke + fault + failsafe + vision
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    # 2026-09-22：补 Redis service。
    # cloud-backend 依赖 Redis（spring.data.redis.host 默认 localhost:6379），
    # 且其 health indicator 会把 Redis 不可达记为 DOWN → /actuator/health 返回
    # 503 SERVICE_UNAVAILABLE → 就绪判定失败。
    # 注意：仓库内 docker-compose（根与 deploy/docker）**均未定义 Redis**，
    # 即应用依赖了部署配置从未提供的组件（另行报告）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Start backend
        # 2026-09-22 修复：必须**显式激活 dev profile**（H2）。
        # application.properties 的默认数据源已改为 PostgreSQL
        # （jdbc:postgresql://localhost:5432/aerofleet_prod），
        # 而本 job **没有 PostgreSQL 服务容器** → 启动时 Hikari/Flyway 连库被拒、
        # 进程直接退出（原 `sleep 12` 后不做任何校验，失败被推迟到后续 smoke 步骤）。
        # 详见 scripts/ci-integration-test.sh 中的同名注释。
        run: |
          java -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=dev &
          # 就绪等待：轮询 /actuator/health 至多 120s（原为固定 sleep 12，无校验）
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend ready (${i} probes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready within 120s"
          curl -s -m 5 http://localhost:8080/actuator/health || echo "(no response)"
          exit 1
      - name: Normal flight smoke (sim -> mission -> RTL + flightlog + joystick)
        run: |
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT.jar &
          sleep 5
          bash scripts/e2e-smoke.sh
      - name: Fault-injection regression (gps-loss / battery-fault / link-loss)
        run: bash scripts/e2e-fault-linux.sh

      - name: Failsafe regression (link-loss mid-mission -> auto RTL)
        run: bash scripts/e2e-failsafe-linux.sh

      - name: Vision regression (camera session -> capture -> orbit -> tracks)
        run: bash scripts/e2e-vision-linux.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [java]
    # 2026-09-22：补 Redis service（同 e2e-smoke，理由见该 job 注释）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        run: |
          chmod +x scripts/ci-integration-test.sh
          scripts/ci-integration-test.sh
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [java, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: cloud-backend
            dockerfile: deploy/docker/Dockerfile.cloud
          - module: drone-sim
            dockerfile: deploy/docker/Dockerfile.sim
          - module: gcs-web
            dockerfile: deploy/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/levango7/nexussky-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
