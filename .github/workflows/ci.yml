          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ java, frontend ]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - name: Frontend dependency audit
        working-directory: gcs-web
        # 不带 --production/--omit=dev：必须把 devDependencies 一起扫。
        # 原写法用 --production 把 vite/esbuild 这类构建期/开发期依赖整体滤掉，
        # 实测退出码 0，而同一份 lockfile 全量扫描是 1（vite<=6.4.2 high）。
        # 这不是理论风险：docker-compose.yml:29 就是用 `npm run dev -- --host 0.0.0.0`
        # 把 Vite dev server 直接暴露到宿主机网卡，dev 依赖链上的漏洞就是在线攻击面。
        run: npm audit --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Pre-populate local Maven repository (Trivy offline dependency resolution)
        continue-on-error: true
        run: mvn -B -q dependency:go-offline
      - name: Trivy filesystem scan
        id: trivy
        # 固定到发布 tag v0.36.0，不再用 @master。理由（供应链）：
        #   @master 是浮动 ref——同一份 workflow 在不同日期会执行不同的 action 代码，
        #   上游合入任何改动（默认 scanners、退出码语义、内置 trivy 版本）都会在没有
        #   任何 PR 评审信号的情况下改变本仓库的安全门禁方向。实测：master 目前比
        #   v0.36.0 领先 11 个提交（含 "Update trivy to v0.74.0"），也就是说
        #   "今天跑的是哪个 trivy" 完全取决于上游当天合进了什么。
        # 注意：这是**有行为差异**的改动（tag 的内置 trivy 比 master 旧），
        # 本仓库无法本地跑 trivy（docker 镜像白名单 + avd/raw.githubusercontent 均被网关拦截），
        # 因此合并后的第一次 security-scan 运行就是这次改动的验收点。
        # 若想要"零行为差异 + 固定 ref"，把 uses 换成 master 当前 commit SHA：
        #   aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml
          # 显式传入忽略清单，而不是依赖 .trivyignore 的隐式查找：
          # trivy-action v0.36.0 的 entrypoint.sh 对不存在的清单文件直接 `exit 1`
          # （ERROR: cannot find ignorefile），所以这条接线不可能静默失效。
          # 清单本身要求每条带 paths 限定 + expired_at 到期 + statement 证据，
          # 且前提由 cloud-backend 的 XsltViewReachabilityTest 机器复核。
          trivyignores: .trivyignore.yaml
          # 0 → 只产 SARIF 不阻断（原状态：名义门禁）
          # 1 → 有发现直接让 job 变红；SARIF 仍然上传，用于看红因。
          # v0.36.0 实测语义修正（run 36647831204 红因 + action 源码
          # entrypoint.sh:76-83）：format=sarif 且未设 limit-severities-for-sarif
          # 时，action 会 **unset TRIVY_SEVERITY** —— 上面的 severity 入参在 SARIF
          # 模式下不生效，exit-code 1 对**任意**严重级的发现都判红（该次运行即被
          # 2 个 MEDIUM 触发）。当前保留这一更严语义：门禁 = 任意严重级的已知
          # 漏洞清零，SARIF 全量上传保证面板可见；若要还原"只拦 CRITICAL/HIGH"，
          # 加 limit-severities-for-sarif: true（代价：MEDIUM 不再进 SARIF/面板）。
          # trivy.yaml 的 scan.offline 保持不变（只影响 Maven 依赖解析不回源，
          # 不影响漏洞数据库下载与退出码语义）。
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        # always()：扫描步骤现在会因 CRITICAL/HIGH 直接判红，
        # 若不加这一条，SARIF 上传会被跳过，安全面板反而在最需要报告的运行里失去数据。
        # 但单有 always() 是错的：本 job 在它之前的 npm audit 步骤失败时，Trivy 步骤
        # **从未执行过**，输出文件根本不存在，于是上传步自己再红一次——
        # run 37407124936 实测：真红因只有一条（source-map-js high），日志里却是
        # 两条 X，第二条是 `Path does not exist: trivy-results.sarif`。
        # 次生红会把唯一有用的信号埋进噪声里，所以这里加两道：
        #   steps.trivy.conclusion != 'skipped' → 扫描没跑就不上传；
        #   hashFiles(...) != ''                → 跑了但没落盘（中途崩溃）也不上传。
        if: always() && steps.trivy.conclusion != 'skipped' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ maven-warm ]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java, javascript ]
    steps:
      - uses: actions/checkout@v4
      - name: Restore Maven local repository (restore-only; saves are owned by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [java, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: cloud-backend
            dockerfile: deploy/docker/Dockerfile.cloud
          - module: drone-sim
            dockerfile: deploy/docker/Dockerfile.sim
          - module: gcs-web
            dockerfile: deploy/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名与 chart / raw k8s / compose 统一为 <registry>/nexussky/<module>
          # （chart 侧由 imageRegistry + cloudBackend|droneSim|gcsWeb.image 拼出，见 values.yaml）
          images: ghcr.io/levango7/nexussky/${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 原生 docker build/push（原为 build-push-action+buildx）：2026-10-09 实测
      # buildx 的 docker-container driver 要先从 Docker Hub 拉 moby/buildkit 镜像，
      # 在限流/超时下连续两轮致红 2/3 个模块。buildx 仅带来 gha 层缓存与 provenance
      # 元数据，不值得把"能否构建"绑在 Docker Hub 可达性上——revert 到标准路径后，
      # 唯一的镜像拉取是 base 镜像（已参数化走 mirror.gcr.io）。
      - name: Build and push ${{ matrix.module }}
        shell: bash
        run: |
          set -e
          TAG_ARGS=""
          while IFS= read -r tag; do [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"; done <<< "${{ steps.meta.outputs.tags }}"
          LABEL_ARGS=""
          while IFS= read -r l; do [ -n "$l" ] && LABEL_ARGS="$LABEL_ARGS --label $l"; done <<< "${{ steps.meta.outputs.labels }}"
          # shellcheck disable=SC2086
          docker build $TAG_ARGS $LABEL_ARGS             --build-arg BASE_REGISTRY=mirror.gcr.io/library             -f "${{ matrix.dockerfile }}" .
          while IFS= read -r tag; do [ -n "$tag" ] && docker push "$tag"; done <<< "${{ steps.meta.outputs.tags }}"
  deploy-secrets:
    name: Deploy Secret Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 独立 job：不依赖构建产物，判定的对象是仓库里的部署清单本身。
    # 存在的理由：values.yaml / deploy/k8s/secret.yaml 里的 REPLACE_WITH_* 占位串
    # 长度达标，能原样通过后端既有的「jwt secret ≥32 字节」强度校验——忘替换的那次
    # 部署不是报错，而是安静地把仓库里公开的字符串当 HMAC-SHA256 密钥上岗，
    # 任何读过本仓库的人都能自造任意租户/ADMIN 的 JWT。
    # 脚本三个方向都断言（默认值必须被拒 / 真实值必须渲染成功 / 结果无残留），
    # 且 helm 不存在时直接 exit 1——跳过不等于通过。
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        # 固定到发布 tag v4.3.1（commit 1a275c3b69536ee54be43f208112b4e1c0d1b3c5）；
        # 与 trivy-action 同口径：不用浮动 major ref，避免上游改动悄悄改变本门禁行为。
        with:
          version: v3.14.4
      - name: 占位凭据门禁校验
        run: bash scripts/check-deploy-secrets.sh
