      - name: Start drone-sim
        run: |
          # C5 第一步：SDK 集成腿也走签名帧通路（同 415 行说明；密钥运行时生成）。
          SIM_SIGNING_KEY="$(openssl rand -hex 16)"
          java -jar drone-sim/target/aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar \
            --signing-key "$SIM_SIGNING_KEY" &
          sleep 5
      - name: SDK integration tests
        run: |
          chmod +x scripts/e2e-sdk-integration.sh
          bash scripts/e2e-sdk-integration.sh
      - name: Docker Compose E2E (if Docker available)
        continue-on-error: true
        run: |
          if command -v docker-compose &>/dev/null; then
            chmod +x scripts/e2e-docker-compose.sh
            bash scripts/e2e-docker-compose.sh
          else
            echo "docker-compose not available, skipping"
          fi

  # C5 签名 e2e 首次接进门禁。
  #
  # 背景：scripts/e2e-signing.ps1 有 884 行 / 6 个场景（正常签名、篡改检测、未签名拒绝、
  # 密钥不匹配、多机密钥分发、签名关闭兼容），但**从未被任何 workflow 调用过**——
  # docs/roadmap-c-drift.md:66 早就登记了这件事。也就是说"签名在工作"这句话此前只有
  # 本机手工跑过一次撑着，C5 第二步（收紧 reject-unsigned）也就没有跨平台的回归护栏。
  #
  # 接进来之前先把脚本改成跨平台了（否则是必然失败而非 flaky）：
  #   - `$env:TEMP` x16 → `$TempDir`（Linux 上 PowerShell 不定义 $env:TEMP，
  #     Join-Path 会退化成相对路径、日志落进仓库目录）
  #   - `-WindowStyle Hidden` x15 → 删除（该参数只在 Windows 的 Start-Process 上存在，
  #     Linux 上直接报"找不到参数"）
  #   - `Get-CimInstance Win32_Process` x2 → 加 $IsWindows 分支，Linux 走 `ps`
  #     （静默失败不可接受：那会让"清理上个场景残留"变成什么都不做，端口被占，
  #      表现为莫名其妙的超时）
  #
  # 当初以观察模式接入（理由：脚本此前只在本机 Windows PowerShell 跑过，未在 Linux CI 上连续复跑，
  # 稳定性未知）。2026-10-20 起已转**硬门禁**（连续多次 run 零红后删掉
  # continue-on-error；删标记 = 把「跑过」升级为「必须通过」）。
  # e2e 救活计划第一批（2026-10-14）：formation / mesh / rid 三个脚本接进门禁。
  #
  # 背景：16 个 e2e 脚本从未进过 CI，其中 15 个已在本机逐个跑通（合计 186 项断言，
  # 台账见 docs/contributing-guide.md §2.5）。本 job 先接价值最高的三个：
  # 编队状态机闭环（FR-18）、中继透明转发（FR-22~25）、RID 广播与超时转态。
  # "能跑"和"有人跑"之间差的正是这一行——不接进来，脚本迟早还会烂回去。
  #
  # 跨平台改造（与 e2e-signing 同源，但那三个脚本是各改各的；本次起抽成
  # scripts/e2e-common.ps1 公共库，后续批次直接复用）：
  #   - jar 路径 `Join-Path $Root 'x\target\y.jar'` → Get-E2eJar（Linux 上反斜杠
  #     不是分隔符，Test-Path 恒 false，会报"jar 不存在"）
  #   - java 可执行 java.exe → Get-E2eJava（Linux 叫 java）
  #   - 残留清理 Get-CimInstance → Stop-E2eStaleProcesses（Windows CIM /
  #     Linux 读 /proc/*/cmdline；**不要用 `& ps -eo`**——PowerShell 里 ps 是
  #     Get-Process 的别名，-eo 直接 parameter binding 失败，e2e-signing 早年
  #     那么写，Linux 分支从没真正跑起来过）
  #   - $env:TEMP → Get-E2eTempDir（Linux runner 上 TEMP 常未设置）
  #   - -WindowStyle Hidden 全部删除（只在 Windows 的 Start-Process 上存在）
  #   - 清理按"命令行留痕标记"（-Dformation-e2e=true 等）精确杀自己，
  #     不按 jar 名一刀切（那会杀掉别的 e2e / 别人会话正在跑的进程）
  #
  # 为什么带 continue-on-error：与 e2e-capability / e2e-signing 同款观察模式。
  # 这三个脚本已在本机 Windows 全绿，但**未在 Linux 上连续复跑**，runner 上的
  # 进程/端口/时序行为可能不同。先收集 flaky 数据，若干次 run 全绿后删掉这行
  # 转为硬门禁。删标记 = 把"跑过"升级为"必须通过"，不涉及任何脚本改动。
      # 上面五个 e2e job 原本带 continue-on-error（观察模式），用于先收集 flaky 数据。
      # 并列上过的历史（各自近十不两次 run）：
      #   E2E core scripts    绿 11 / skipped 1 / 红 0
      #   E2E MAVLink signing 绿 11 / skipped 1 / 红 0
      #   E2E B1 scripts      绿  9 / skipped 1 / 红 0
      #   E2E B2 A-type      绿  2 / skipped 0 / 红 0
      #   E2E B2 B-type      绿  2 / skipped 0 / 红 0
      # 全部零红，所以现在去掉 continue-on-error 转为硬门禁；
      # job 名里的「— observe」也一并去掉（否则名字会和行为对不上）。
  e2e-core-scripts:
    name: E2E core scripts (formation / mesh / rid)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [ java ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      # 每轮开头主动清一次残留（runner 是干净容器，通常命中 0；命中非 0 说明
      # 上个场景没退干净，日志里能看到线索）
      - name: Clean leftovers before start
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'formation-e2e','mesh-e2e','rid-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-formation (FR-18 编队演示闭环)
        run: pwsh -NoProfile -File scripts/e2e-formation.ps1
        env:
          AF_BACKEND_REST_PORT: 18080
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'formation-e2e','mesh-e2e','rid-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-mesh (FR-22~25 中继透明转发, simplified)
        run: pwsh -NoProfile -File scripts/e2e-mesh.ps1 -Mode simplified
        env:
          AF_BACKEND_REST_PORT: 18081
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'formation-e2e','mesh-e2e','rid-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-rid (RID 广播 + 超时转态)
        run: pwsh -NoProfile -File scripts/e2e-rid.ps1 -SkipBuild
        env:
          AF_BACKEND_PORT: 18082
      - name: Upload core e2e logs on failure
        if: failure()
        run: |
          mkdir -p core-e2e-logs
          find "${{ runner.temp }}" -maxdepth 1 \
            \( -name 'formation-*.log' -o -name 'mesh-*.log' -o -name 'rid-e2e-*.log' \) \
            -exec cp {} core-e2e-logs/ \; 2>/dev/null || true
          ls -la core-e2e-logs || echo "(no logs captured)"

  e2e-signing:
    name: E2E MAVLink signing (6 scenarios)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [ java, frontend ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Signing e2e (6 scenarios)
        run: |
          # 端口用高位段，避开 runner 上任何可能占着默认段的进程；
          # 脚本自带端口占用检查，撞上会直接退出而不是假失败。
          pwsh -NoProfile -File scripts/e2e-signing.ps1 -SkipBuild \
            -BackendRestPort 18080 -BackendUdpPort 24550 \
            -DronePort 24540 -DronePort2 24541 -LinkSimPort 24600 \
            -RedisHost localhost -RedisPort 6379
      - name: Upload signing e2e logs on failure
        if: failure()
        run: |
          mkdir -p signing-logs
          find "${{ runner.temp }}" -maxdepth 1 -name 'signing-e2e-*.log' \
            -exec cp {} signing-logs/ \; 2>/dev/null || true
          ls -la signing-logs/ || echo "(no logs captured)"


  # e2e 救活计划第二批（2026-10-17）：regulator / dock / route-templates / defect
  # 四个脚本接进门禁（当初为观察模式，2026-10-20 起转硬门禁）。
  #
  # 背景：与第一批（上方 e2e-core-scripts）同一条脉络——16 个 e2e 脚本从未进过 CI，
  # 本批 4 个已在本机 Windows 串行全绿（2026-10-17 深夜验证，master 035a338，
  # 合计 94/94 断言：regulator 37 / dock 23 / route-templates 16 / defect 18）。
  #
  # 跨平台改造（本批全部复用 e2e-common.ps1 既有抽象，与第一批同源）：
  #   - jar 路径反斜杠 → Get-E2eJar（Linux 上反斜杠不是分隔符，Test-Path 恒 false，
  #     会误判 jar 缺失进构建分支——该分支此前还硬编码 Windows 的 JDK 路径）；
  #   - java.exe 探测 → Get-E2eJava；
  #   - $env:TEMP → Get-E2eTempDir（Linux runner 常未设置）；
  #   - -WindowStyle Hidden 全部删除（只在 Windows 的 Start-Process 上存在）；
  #   - regulator 的 Get-CimInstance Win32_Process 清理 ×2 → Stop-E2eStaleProcesses：
  #     原按命令行模式（regulator-sim / aerofleet.regulator / AF-REG）匹配，
  #     Windows-only 且静默失效（清理变空转，端口被占表现为超时）。改为给 5 处
  #     java 启动命令行加 -Dregulator-e2e=true 留痕（-jar 之前，由 JVM 消费，
  #     不进 main args，对 sim 手写解析零影响），按标记精确杀。
  #
  # 串行原因：cloud-backend 默认监听 UDP 14550（aerofleet.udp-port），4 个脚本均
  # 未覆盖该端口 → 同一 runner 上不能并行（多会话并发撞 14550 的坑 COORDINATION.md
  # 有记载）。单 job 内串行，脚本间夹按标记的清理兜底（与第一批三脚本同款安排）。
  # 中间清理的 marker 额外覆盖 sim 残留：route/defect 的 drone-sim 命令行不含
  # backend 那个 h2:mem 标记，补 AF-ROUTE-01 / AF-DEFECT-01（dock 的 DOCK-E2E-001
  # 已被 dock-e2e 大小写不敏感匹配覆盖）。
  #
  # AF_BACKEND_PORT 统一 18099：regulator 默认 8080（本机被常驻容器占用，CI 环境
  # 默认段也不保险），与其余三个脚本的默认 18099 对齐；每个脚本退出时自停
  # backend，中间清理按 marker 兜底，18099 串行复用无冲突。
  #
  # 当初以观察模式接入（理由：4 个脚本只在本机 Windows 全绿（94/94，但未在 Linux 上连续复跑，
  # runner 上的进程/端口/时序行为可能不同）。
  # 2026-10-20 起已转**硬门禁**：连续多次 run 零红后删掉 continue-on-error
  # （删标记 = 把「跑过」升级为「必须通过」，不涉及任何脚本改动）。
  e2e-b1-scripts:
    name: E2E B1 scripts (regulator / dock / route-templates / defect)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [ java ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      # 每轮开头主动清一次残留（runner 是干净容器，通常命中 0；命中非 0 说明
      # 上个场景没退干净，日志里能看到线索）
      - name: Clean leftovers before start
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'regulator-e2e','dock-e2e','route-templates-e2e','AF-ROUTE-01','defect-e2e','AF-DEFECT-01' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-regulator (FR-31~40 监管合规全链路)
        run: pwsh -NoProfile -File scripts/e2e-regulator.ps1 -SkipBuild
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'regulator-e2e','dock-e2e','route-templates-e2e','AF-ROUTE-01','defect-e2e','AF-DEFECT-01' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-dock (R1~R5 机巢管控)
        run: pwsh -NoProfile -File scripts/e2e-dock.ps1 -SkipBuild
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'regulator-e2e','dock-e2e','route-templates-e2e','AF-ROUTE-01','defect-e2e','AF-DEFECT-01' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-route-templates (G1~G4+E1 行业航线库)
        run: pwsh -NoProfile -File scripts/e2e-route-templates.ps1 -SkipBuild
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'regulator-e2e','dock-e2e','route-templates-e2e','AF-ROUTE-01','defect-e2e','AF-DEFECT-01' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-defect (A1~A5 缺陷闭环)
        run: pwsh -NoProfile -File scripts/e2e-defect.ps1 -SkipBuild
        env:
          AF_BACKEND_PORT: 18099
      - name: Upload b1 e2e logs on failure
        if: failure()
        run: |
          mkdir -p b1-e2e-logs
          find "${{ runner.temp }}" -maxdepth 1 \
            \( -name 'regulator-e2e-*.log' -o -name 'af-dock-*.log' -o -name 'af-route-*.log' -o -name 'af-defect-*.log' \) \
            -exec cp {} b1-e2e-logs/ \; 2>/dev/null || true
          ls -la b1-e2e-logs || echo "(no logs captured)"

  # ── B2 第三批 e2e（已转硬门禁）───────────────────────────────────────────
  # 与 e2e-b1-scripts 平行、互不依赖。十脚本里 9 个接入；px4-sitl 不接入
  # （ubuntu runner 无 PX4 SITL、脚本宿主导向，接了必红）。
  #
  # 拆两个 job 的原因（与 B1 单 job 不同）：cloud-backend 恒绑 UDP 14550
  # （aerofleet.udp-port，所有脚本均不覆盖）→ 同一 runner 内任意两个 backend
  # 不能共存、脚本必须串行；A/B 两型分到两个独立 runner 上可安全并行。
  #
  # 当初以观察模式接入（理由：9 个脚本只在本机 Windows 全绿，未在 Linux 连续复跑，
  # runner 上的进程/端口/时序行为可能不同）。
  # 2026-10-20 起已转**硬门禁**：连续多次 run 零红后删掉 continue-on-error
  # （删标记 = 把「跑过」升级为「必须通过」）。
  e2e-b2-a-type:
    name: E2E B2 A-type scripts (cv-eval / operations / rtk / sensing / uspace / roc / spray)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [ java ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      # 每轮开头主动清一次残留（runner 是干净容器，通常命中 0；命中非 0 说明
      # 上个场景没退干净，日志里能看到线索）。A 型 6 脚本的 backend 与 sim
      # 命令行统一带 -D<name>-e2e=true，一个 marker 清两类进程。
      - name: Clean leftovers before start
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      # 6 步串行（backend 恒绑 UDP 14550，同 runner 不能并行）。每步 tee 留档
      # step 日志：job 已是硬门禁，脚本失败会因 pipefail 退非零；末尾的聚合步骤
      # 再从 step 日志重新统计一遍作为兜底。
      - name: e2e-cv-eval (F1 CV 评测三指标链路)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-cv-eval.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-cv-eval-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-operations (E6 运营报表聚合)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-operations.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-operations-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-rtk (F6 RTK 高精度链路三机对照)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-rtk.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-rtk-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-sensing (E2+E4 侦测态势双源)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-sensing.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-sensing-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      - name: e2e-uspace (E3 U-space 四服务)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-uspace.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-uspace-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      # e2e-roc（E1 一控多机席位）：席位创建→机队绑定→批量指令→警情→确认派飞。
      # 2026-10-20 接入：本脚本原先只在本机 Windows 跑过（跨平台改造见脚本头部说明），
      # 改造后本机 14/14 全绿。sim 端口 14580/14581、sysid 71/72 与本 job 其余脚本不撞。
      - name: e2e-roc (E1 一控多机席位)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-roc.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-roc-step.log"
        env:
          AF_BACKEND_PORT: 18099
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'cv-eval-e2e','operations-e2e','rtk-e2e','sensing-e2e','uspace-e2e','roc-e2e','spray-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"

      # spray 端口已参数化并入统一变量：AF_BACKEND_PORT=18099（REST）；drone/sim
      # 端口保持默认 14550/14551（drone-port 与 udp-port 的重叠语义本机已验，
      # CI 首跑继续观察）。
      - name: e2e-spray (喷洒+配送机载链路)
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File scripts/e2e-spray.ps1 -SkipBuild 2>&1 | tee "$RUNNER_TEMP/e2e-spray-step.log"
        env:
          AF_BACKEND_PORT: 18099
      # D8 断言聚合：两族格式一个正则通吃：[PASS]/[FAIL]（cv-eval/operations/roc/
      # rtk/sensing/uspace）与 PASS:/FAIL:（spray）。
      #
      # 这一步是**兜底**：脚本本身失败会退非零（下面用 pipefail 防 tee 吞掉退出码），
      # job 已是硬门禁。但万一某个脚本印了 [FAIL] 却忘了 exit 1，聚合步骤仍会把它判红
      # —— 不让「印了红字但 job 绿」漏过去。
      # 判红文案用 ::error::（不是 ::warning::）：观察模式早已转正，
      # 「观察模式不阻断」那句话本身就是一处声明≠行为。
      - name: Summarize e2e assertions (b2 a-type)
        if: always()
        shell: bash
        run: |
          total_pass=0
          total_fail=0
          for f in "$RUNNER_TEMP"/e2e-*-step.log; do
            [ -f "$f" ] || continue
            p=$(grep -cE '\[PASS\]|PASS:' "$f" || true)
            fl=$(grep -cE '\[FAIL\]|FAIL:' "$f" || true)
            echo "$(basename "$f"): PASS=$p FAIL=$fl"
            total_pass=$((total_pass + p))
            total_fail=$((total_fail + fl))
          done
          echo "B2 A-type assertions total: PASS=$total_pass FAIL=$total_fail"
          if [ "$total_fail" -gt 0 ]; then
            echo "::error::B2 A-type e2e ${total_fail} 条断言失败 —— 聚合步骤直接判红（脚本已退非零，这里是兜底）"
            exit 1
          fi
      - name: Collect b2 a-type e2e logs on failure
        if: failure()
        run: |
          mkdir -p b2a-e2e-logs
          find "${{ runner.temp }}" -maxdepth 1 \
            \( -name 'af-cveval-*' -o -name 'af-ops-*' -o -name 'af-rtk-*' \
               -o -name 'af-sensing-*' -o -name 'af-uspace-*' -o -name 'af-roc-*' \
               -o -name 'spray-*' \
               -o -name 'e2e-*-step.log' \) \
            -exec cp {} b2a-e2e-logs/ \; 2>/dev/null || true
          ls -la b2a-e2e-logs || echo "(no logs captured)"
      - name: Upload b2 a-type e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: b2a-e2e-logs
          path: b2a-e2e-logs/
          retention-days: 14

  # B2 B 型 3 脚本：**不自启 backend**（保持外部启动契约），每步由 CI 起一个
  # 带定制参数的 backend：统一 h2:mem + dev profile + jwt-secret + REST 18099
  # （注意变量名与 A 型不同：B 型脚本读 AF_BACKEND_REST_PORT），等业务端点
  # 就绪后跑脚本，再按记录的 PID 杀 backend、按 marker 兜底。就绪探针用
  # /api/v1/drones——/actuator/health 在 Redis 未就绪时恒 503，会把"起得来"
  # 误判成"起不来"。三步共用 REST 18099：若上一步 backend 残留，本步新起的
  # java 会端口冲突而探针却命中旧进程——所以步间清理是正确性问题，不只是
  # 卫生问题。
  e2e-b2-b-type:
    name: E2E B2 B-type scripts (network / rf / vision-pixels)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [ java ]
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Build all
        run: mvn -B -DskipTests package
      - name: Clean leftovers before start
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'network-e2e','network-backend-e2e','rf-e2e','rf-backend-e2e','pixels-e2e','pixels-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      # network：backend 的 drone-port 指向链路代理 14600（link-sim 在其上
      # 施加 LTE/Starlink 损伤画像）。
      - name: e2e-network (LTE/Starlink 损伤链路任务流)
        shell: bash
        env:
          AF_BACKEND_REST_PORT: 18099
        run: |
          set -o pipefail
          # 后端的 marker 与脚本自己的 sim marker **必须分开**：
          # 注意：不只是 -D 标记，**h2:mem 库名也在后端的命令行里**，
          # 而匹配是松散子串，所以库名也得避开 sim 的 marker。
          # 否则脚本开头的清理依旧会杀掉脚下的后端（上一轮 CI 就是这样）。
          # e2e-network.ps1 开头会调 Stop-E2eStaleProcesses 清理上一轮遗留的
          # sim（marker = network-e2e），若后端也用同一个 marker，它会把脚本脚下的
          # 后端一并杀掉 —— 后端一死，脚本第一个前置检查
          # (后端可达) 就会失败，而失败原因被 catch { } 吞掉，零诊断信息。
          # 那次 CI 就是这样：后端日志里 /api/v1/drones 只有 CI 自己那一次，
          # 脚本的请求根本没到达。
          java -Dnetwork-backend-e2e=true -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --server.port=18099 \
            --spring.profiles.active=dev \
            --spring.datasource.url='jdbc:h2:mem:network-backend-e2e;DB_CLOSE_DELAY=-1' \
            --aerofleet.security.jwt-secret=e2e-test-secret-0123456789abcdef0123456789abcdef \
            --aerofleet.drone-port=14600 \
            > "$RUNNER_TEMP/network-backend.log" 2>&1 &
          backend_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -sf --max-time 3 http://localhost:18099/api/v1/drones > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::network backend 90s 内未就绪，backend 末尾日志："
            tail -n 50 "$RUNNER_TEMP/network-backend.log" || true
            kill "$backend_pid" 2>/dev/null || true
            exit 1
          fi
          rc=0
          pwsh -NoProfile -File scripts/e2e-network.ps1 2>&1 | tee "$RUNNER_TEMP/e2e-network-step.log" || rc=$?
          kill "$backend_pid" 2>/dev/null || true
          wait "$backend_pid" 2>/dev/null || true
          pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'network-e2e','network-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
          exit $rc
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'network-e2e','network-backend-e2e','rf-e2e','rf-backend-e2e','pixels-e2e','pixels-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      # rf：backend 保持默认 drone-port 14550 + 默认 extra 14541-14543——
      # sim 挂 14543，恰在默认扫描段内，无需额外参数。
      - name: e2e-rf (E1 RF 链路几何回归)
        shell: bash
        env:
          AF_BACKEND_REST_PORT: 18099
        run: |
          set -o pipefail
          java -Drf-backend-e2e=true -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --server.port=18099 \
            --spring.profiles.active=dev \
            --spring.datasource.url='jdbc:h2:mem:rf-backend-e2e;DB_CLOSE_DELAY=-1' \
            --aerofleet.security.jwt-secret=e2e-test-secret-0123456789abcdef0123456789abcdef \
            > "$RUNNER_TEMP/rf-backend.log" 2>&1 &
          backend_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -sf --max-time 3 http://localhost:18099/api/v1/drones > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::rf backend 90s 内未就绪，backend 末尾日志："
            tail -n 50 "$RUNNER_TEMP/rf-backend.log" || true
            kill "$backend_pid" 2>/dev/null || true
            exit 1
          fi
          rc=0
          pwsh -NoProfile -File scripts/e2e-rf.ps1 2>&1 | tee "$RUNNER_TEMP/e2e-rf-step.log" || rc=$?
          kill "$backend_pid" 2>/dev/null || true
          wait "$backend_pid" 2>/dev/null || true
          pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'rf-e2e','rf-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
          exit $rc
      - name: Clean leftovers between scripts
        if: always()
        run: pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'network-e2e','network-backend-e2e','rf-e2e','rf-backend-e2e','pixels-e2e','pixels-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
      # vision-pixels：后端三参数缺一不可（脚本文件头有完整说明）——
      # source=pixels 才走真 JPEG 检测管道；sim-truth-base 指向本脚本 sim 的
      # 18082（默认 18080 会 ConnectException）；drone-extra-ports=14544 让
      # 被动监听的 sim 能被后端发现。
      - name: e2e-vision-pixels (E2 像素域视觉链路)
        shell: bash
        env:
          AF_BACKEND_REST_PORT: 18099
        run: |
          set -o pipefail
          java -Dpixels-backend-e2e=true -jar cloud-backend/target/aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar \
            --server.port=18099 \
            --spring.profiles.active=dev \
            --spring.datasource.url='jdbc:h2:mem:pixels-backend-e2e;DB_CLOSE_DELAY=-1' \
            --aerofleet.security.jwt-secret=e2e-test-secret-0123456789abcdef0123456789abcdef \
            --aerofleet.vision.source=pixels \
            --aerofleet.sim-truth-base=http://127.0.0.1:18082 \
            --aerofleet.drone-extra-ports=14544 \
            > "$RUNNER_TEMP/pixels-backend.log" 2>&1 &
          backend_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -sf --max-time 3 http://localhost:18099/api/v1/drones > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::pixels backend 90s 内未就绪，backend 末尾日志："
            tail -n 50 "$RUNNER_TEMP/pixels-backend.log" || true
            kill "$backend_pid" 2>/dev/null || true
            exit 1
          fi
          rc=0
          pwsh -NoProfile -File scripts/e2e-vision-pixels.ps1 2>&1 | tee "$RUNNER_TEMP/e2e-vision-pixels-step.log" || rc=$?
          kill "$backend_pid" 2>/dev/null || true
          wait "$backend_pid" 2>/dev/null || true
          pwsh -NoProfile -Command ". ./scripts/e2e-common.ps1; 'pixels-e2e','pixels-backend-e2e' | ForEach-Object { \$n = Stop-E2eStaleProcesses -Marker \$_; Write-Output \"cleaned \$_ = \$n\" }"
          exit $rc
      # D8 断言聚合：B 型 3 脚本全部是 PASS:/FAIL: 族，正则与 A 型共用
      # （\[PASS\]|PASS: 两族通吃）。
      #
      # 这一步是**兜底**：脚本本身失败会退非零（下面用 `|| rc=$?` + `exit $rc` 把退出码
      # 传出来，pipefail 防 tee 吞掉），job 已是硬门禁。但万一某个脚本印了 [FAIL] 却
      # 忘了 exit 1，聚合步骤仍会把它判红 —— 不让「印了红字但 job 绿」溜过去。
      # 判红文案用 ::error::（不是 ::warning::）：观察模式早已转正，
      # 「观察模式不阻断」那句话本身就是一处声明≠行为。
      - name: Summarize e2e assertions (b2 b-type)
        if: always()
        shell: bash
        run: |
          total_pass=0
          total_fail=0
          for f in "$RUNNER_TEMP"/e2e-*-step.log; do
            [ -f "$f" ] || continue
            p=$(grep -cE '\[PASS\]|PASS:' "$f" || true)
            fl=$(grep -cE '\[FAIL\]|FAIL:' "$f" || true)
            echo "$(basename "$f"): PASS=$p FAIL=$fl"
            total_pass=$((total_pass + p))
            total_fail=$((total_fail + fl))
          done
          echo "B2 B-type assertions total: PASS=$total_pass FAIL=$total_fail"
          if [ "$total_fail" -gt 0 ]; then
            echo "::error::B2 B-type e2e ${total_fail} 条断言失败 —— 聚合步骤直接判红（脚本已退非零，这里是兜底）"
            exit 1
          fi
      - name: Collect b2 b-type e2e logs on failure
        if: failure()
        run: |
          mkdir -p b2b-e2e-logs
          find "${{ runner.temp }}" -maxdepth 1 \
            \( -name 'af-rf-*' -o -name 'af-pixels-*' -o -name '*-backend.log' \
               -o -name 'e2e-*-step.log' \) \
            -exec cp {} b2b-e2e-logs/ \; 2>/dev/null || true
          ls -la b2b-e2e-logs || echo "(no logs captured)"
      - name: Upload b2 b-type e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: b2b-e2e-logs
          path: b2b-e2e-logs/
          retention-days: 14

  # MJPEG 取流链路 e2e。**硬门禁**。
  #
  # 为什么单独立一个 job：这条链路（注册设备 -> 短令牌 -> 拉 HTTP 帧源 -> 吐
  # multipart MJPEG -> 注销后 404）此前**从来没有在 CI 里跑过** —— 它需要一台
  # 真摄像头，GitHub runner 没有。而它里面有一条硬断言「匿名取流必须被 401 拒掉」，
  # 那条断言**只在非 dev 配置下成立**（dev 模式下 Spring Security 全放行、
  # StreamTokenFilter 直接跳过），仓库里启动后端的标准姿势恰恰是 dev profile。
  # 于是：要么没人跑，要么红在错的原因上。
  #
  # 本 job 用 scripts/e2e-mjpeg-ci.sh 把前置条件固化成配方：
  # dev 起一次建 ADMIN 用户 -> 优雅停（让 H2 落盘）-> 以 dev-mode=false 重启
  # -> 起合成帧源（scripts/synthetic-frame-source.py，CI 没有摄像头）-> 跑链路。
  e2e-mjpeg:
    name: E2E MJPEG stream (non-dev auth posture)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ maven-warm ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      # 先自证合成帧源：它吐的必须是**真 JPEG** 且会轮换。
      # 不然 CI 里那条「每帧都是真 JPEG」「帧内容在变」就是在测一个假帧源。
      - name: Synthetic frame source self-test
        run: python3 scripts/synthetic-frame-source.py --self-test
      - name: MJPEG stream e2e (non-dev auth posture)
        run: bash scripts/e2e-mjpeg-ci.sh --build
      - name: Collect mjpeg e2e logs on failure
        if: failure()
        run: |
          mkdir -p mjpeg-e2e-logs
          cp -f /tmp/nexussky-mjpeg-e2e/*.log mjpeg-e2e-logs/ 2>/dev/null || true
          ls -la mjpeg-e2e-logs || echo "(no logs captured)"
      - name: Upload mjpeg e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: mjpeg-e2e-logs
          path: mjpeg-e2e-logs/
          retention-days: 14

  # 变异测试基线门禁。**硬门禁**。
  #
  # 为什么要有：常规 jacoco 覆盖率回答"这段代码被跑到过没有"，
  # 回答不了"这段代码的行为被钉住了没有" —— 一段被调用了一百次、却只断言
  # 「没抛异常」的代码，覆盖率是满的，行为却完全没被钉住。
  #
  # 2026-10-21 用 PIT 审 security 包就是这么翻车的：密钥掩码函数被变异成
  # 「返回 null」之后**存活** —— 也就是「哪天掩码退化成返回明文密钥，
  # 现有测试一条都不会红」。同批还翻出登录限流阈值、X-Forwarded-For 信任开关、
  # 口令哈希落库三处真缺口。
  #
  # 本 job 跑 PIT（mvn -Pmutation，profile 默认不启用），
  # 再由 scripts/check-mutation-baseline.py 对基线判红（变异分数是**棘轮**，
  # 不许低于基线；报告缺失/损坏一律判红 —— 跳过不等于通过）。
  mutation-gate:
    name: Mutation baseline gate (security package)
    runs-on: ubuntu-24.04
    # 本机实测 15 分钟（共享 runner 更慢，留够余量）；超时是安全网，不是常态。
    timeout-minutes: 45
    needs: [ maven-warm ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Compile cloud-backend (main + tests)
        run: mvn -B -pl cloud-backend -am test-compile -DskipTests
      - name: Mutation test (PIT, security package)
        # 刻意**不加 -am**：profile 的 targetClasses 指向 io.aerofleet.cloud.security.*，
        # 带 -am 会让 PIT 在上游模块（mavlink-core 等）上各跑一遍，而那边没有匹配的类
        # ⇒ 插件报"没找到变异体"把构建打断。上一行的 test-compile 已经带 -am，
        # 依赖模块在同一个 reactor 里编好了，这里不需要。
        run: mvn -B -pl cloud-backend -Pmutation pitest:mutationCoverage
      - name: Mutation baseline gate self-test
        run: python3 scripts/check-mutation-baseline.py --self-test
      - name: Mutation baseline gate
        run: |
          if [ ! -f cloud-backend/target/pit-reports/mutations.xml ]; then
            echo "::error::PIT 没有产出报告 —— 变异门禁本次无法判定，直接判红（跳过不等于通过）"
            ls -la cloud-backend/target/pit-reports/ 2>/dev/null || true
            exit 1
          fi
          python3 scripts/check-mutation-baseline.py \
            --report cloud-backend/target/pit-reports/mutations.xml

  # e2e 公共库自检。**硬门禁**（没有 continue-on-error）——
  # 它不跑任何被测系统，只花几秒换掉一整类"跑了但不算数"。
  e2e-common-selftest:
    name: E2E common library self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 为什么在 Linux runner 上跑：Read-E2eErrorBody 的两条分支分别对应
      # PowerShell 5.1 的 HttpWebResponse 与 7+ 的 HttpResponseMessage。
      # 本机只有 5.1 时 7+ 那条**永远测不到**，而 Linux runner 跑的正是 pwsh。
      # 自检把两种对象形状都直接喂给读取器，因此在这里能同时验两条。
      #
      # 不加 continue-on-error 的理由：本仓库已有多批 e2e 是"观察模式"
      # （continue-on-error），若这一条也那样，就等于没有任何东西在守
      # e2e-common.ps1 —— 而各 e2e 脚本都依赖它。
      - name: e2e-common library self-test
        shell: pwsh
        run: ./scripts/e2e-common-selftest.ps1


  coord-status-selftest:
    name: Coordination status board self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # 自测里的 T2/T3/T5 要真的跑一次 --write（那一步会调 gh pr list），
      # 所以这里必须给 gh 一个可用的凭据；否则它们只能走 UNVERIFIED 降级分支。
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # 为什么要有这个 job：生成器自己带着 --self-test，却从来没人在 CI 里跑它。
      # 2026-10-20 实测：写回守卫比的是**整份文件**的行数，自动段一变短（工作树少了、
      # 内容精简）就判成"写坏"而拒写 —— 状态板自 2026-10-12 起冻住，各 agent 的开工声明
      # 再也发不出去（读板的人只能看到 8 天前的过期事实）。守卫已改成只比「标记块之外」的
      # 内容，自测新增 T5 覆盖"旧块更长时仍须写成功"，并做过变异验证（T5 能杀掉旧写法）。
      #
      # 自测跑在临时夹具上（COORD_STATUS_FILE 指向 tmp），不会碰仓库里的 .coord/STATUS.md。
      - name: Self-test the coordination status board generator
        run: bash scripts/coord-status.sh --self-test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ java, frontend ]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - name: Frontend dependency audit
        working-directory: gcs-web
        # 不带 --production/--omit=dev：必须把 devDependencies 一起扫。
        # 原写法用 --production 把 vite/esbuild 这类构建期/开发期依赖整体滤掉，
        # 实测退出码 0，而同一份 lockfile 全量扫描是 1（vite<=6.4.2 high）。
        # 这不是理论风险：docker-compose.yml:29 就是用 `npm run dev -- --host 0.0.0.0`
        # 把 Vite dev server 直接暴露到宿主机网卡，dev 依赖链上的漏洞就是在线攻击面。
        run: npm audit --audit-level=high
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven local repository (warmed by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - name: Pre-populate local Maven repository (Trivy offline dependency resolution)
        continue-on-error: true
        run: mvn -B -q dependency:go-offline
      - name: Trivy filesystem scan
        id: trivy
        # 固定到发布 tag v0.36.0，不再用 @master。理由（供应链）：
        #   @master 是浮动 ref——同一份 workflow 在不同日期会执行不同的 action 代码，
        #   上游合入任何改动（默认 scanners、退出码语义、内置 trivy 版本）都会在没有
        #   任何 PR 评审信号的情况下改变本仓库的安全门禁方向。实测：master 目前比
        #   v0.36.0 领先 11 个提交（含 "Update trivy to v0.74.0"），也就是说
        #   "今天跑的是哪个 trivy" 完全取决于上游当天合进了什么。
        # 注意：这是**有行为差异**的改动（tag 的内置 trivy 比 master 旧），
        # 本仓库无法本地跑 trivy（docker 镜像白名单 + avd/raw.githubusercontent 均被网关拦截），
        # 因此合并后的第一次 security-scan 运行就是这次改动的验收点。
        # 若想要"零行为差异 + 固定 ref"，把 uses 换成 master 当前 commit SHA：
        #   aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivy-config: trivy.yaml
          # 显式传入忽略清单，而不是依赖 .trivyignore 的隐式查找：
          # trivy-action v0.36.0 的 entrypoint.sh 对不存在的清单文件直接 `exit 1`
          # （ERROR: cannot find ignorefile），所以这条接线不可能静默失效。
          # 清单本身要求每条带 paths 限定 + expired_at 到期 + statement 证据，
          # 且前提由 cloud-backend 的 XsltViewReachabilityTest 机器复核。
          trivyignores: .trivyignore.yaml
          # 0 → 只产 SARIF 不阻断（原状态：名义门禁）
          # 1 → 有发现直接让 job 变红；SARIF 仍然上传，用于看红因。
          # v0.36.0 实测语义修正（run 36647831204 红因 + action 源码
          # entrypoint.sh:76-83）：format=sarif 且未设 limit-severities-for-sarif
          # 时，action 会 **unset TRIVY_SEVERITY** —— 上面的 severity 入参在 SARIF
          # 模式下不生效，exit-code 1 对**任意**严重级的发现都判红（该次运行即被
          # 2 个 MEDIUM 触发）。当前保留这一更严语义：门禁 = 任意严重级的已知
          # 漏洞清零，SARIF 全量上传保证面板可见；若要还原"只拦 CRITICAL/HIGH"，
          # 加 limit-severities-for-sarif: true（代价：MEDIUM 不再进 SARIF/面板）。
          # trivy.yaml 的 scan.offline 保持不变（只影响 Maven 依赖解析不回源，
          # 不影响漏洞数据库下载与退出码语义）。
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        # always()：扫描步骤现在会因 CRITICAL/HIGH 直接判红，
        # 若不加这一条，SARIF 上传会被跳过，安全面板反而在最需要报告的运行里失去数据。
        # 但单有 always() 是错的：本 job 在它之前的 npm audit 步骤失败时，Trivy 步骤
        # **从未执行过**，输出文件根本不存在，于是上传步自己再红一次——
        # run 37407124936 实测：真红因只有一条（source-map-js high），日志里却是
        # 两条 X，第二条是 `Path does not exist: trivy-results.sarif`。
        # 次生红会把唯一有用的信号埋进噪声里，所以这里加两道：
        #   steps.trivy.conclusion != 'skipped' → 扫描没跑就不上传；
        #   hashFiles(...) != ''                → 跑了但没落盘（中途崩溃）也不上传。
        if: always() && steps.trivy.conclusion != 'skipped' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [ maven-warm ]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java, javascript ]
    steps:
      - uses: actions/checkout@v4
      - name: Restore Maven local repository (restore-only; saves are owned by maven-warm)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v2
          restore-keys: |
            mvn-${{ runner.os }}-
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
      - name: Guard open CodeQL alert count
        # 2026-10-11 发现仓上 4 条 open 告警全部停留在创建日（2026-09-25）从未更新，
        # 而逐条对照代码后确认处置都已存在——缺的只是没人去关。
        # 这种"面板登记滞后于代码"不会让任何测试转红，于是永久留在那里，
        # 将来真出现新告警时会被这 4 条历史噪音淹没。
        #
        # --allow 里是**已登记**的编号：它们不计入 open 数，但
        # docs/codeql-alert-disposition.md 必须写明逐条依据。
        # 每 dismiss 一条，就从 --allow 里删掉对应编号——让清单只减不增。
        #
        # 不加 --require-data：CodeQL Actions 的 runner 上没有
        # code-scanning 读权限，gh 取不到数是**正当场景**。
        # 此时明确打印 WARN 并跳过核对（exit 0）——但绝不说成"0 条 open"。
        # 严格的本地核对用 --require-data。
        # 2026-10-11：4 条历史告警已全部去面板 dismiss（见
        # docs/codeql-alert-disposition.md），--allow 登记随之清空——
        # 守卫回到“默认全关”：再出现 open 即红，需要新增 open 必须显式提
        # --max-open 并在处置文档登记理由。
        run: >-
          python3 scripts/check-codeql-alerts.py

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [java, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: cloud-backend
            dockerfile: deploy/docker/Dockerfile.cloud
          - module: drone-sim
            dockerfile: deploy/docker/Dockerfile.sim
          - module: gcs-web
            dockerfile: deploy/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        # 只有真要推的那条路径需要登录（PR 走"只构建不发布"，见 .coord/GAPS.md G-4）。
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名与 chart / raw k8s / compose 统一为 <registry>/nexussky/<module>
          # （chart 侧由 imageRegistry + cloudBackend|droneSim|gcsWeb.image 拼出，见 values.yaml）
          images: ghcr.io/levango7/nexussky/${{ matrix.module }}
          # latest 只允许由 master 的 push 产生。原来这里是无条件的 type=raw,value=latest，
          # 于是**任何一条 PR 的绿 run 都会覆盖 latest**，而且 image.revision 是
          # refs/pull/N/merge 那个不对应任何分支提交的 sha（实证日志：PR #61 的 run
          # 38288389281 推了 ghcr.io/levango7/nexussky/cloud-backend:latest）。
          # 按 latest 部署的人（compose / raw k8s 都这么写）当时拿到的不是 master。
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=sha,format=short

      # 原生 docker build/push（原为 build-push-action+buildx）：2026-10-09 实测
      # buildx 的 docker-container driver 要先从 Docker Hub 拉 moby/buildkit 镜像，
      # 在限流/超时下连续两轮致红 2/3 个模块。buildx 仅带来 gha 层缓存与 provenance
      # 元数据，不值得把"能否构建"绑在 Docker Hub 可达性上——revert 到标准路径后，
      # 唯一的镜像拉取是 base 镜像（已参数化走 mirror.gcr.io）。
      - name: Build ${{ matrix.module }}
        shell: bash
        run: |
          set -e
          TAG_ARGS=""
          while IFS= read -r tag; do [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"; done <<< "${{ steps.meta.outputs.tags }}"
          LABEL_ARGS=""
          while IFS= read -r l; do [ -n "$l" ] && LABEL_ARGS="$LABEL_ARGS --label $l"; done <<< "${{ steps.meta.outputs.labels }}"
          # shellcheck disable=SC2086
          docker build $TAG_ARGS $LABEL_ARGS             --build-arg BASE_REGISTRY=mirror.gcr.io/library             -f "${{ matrix.dockerfile }}" .

      - name: Push ${{ matrix.module }}
        # 发布只对 master 的 push 开放（见 .coord/GAPS.md G-4）。改前是一条裸的
        # `docker push`，与构建同在一个步骤、同一个事件门槛都没有 ⇒ 每条绿 PR 都在推 :latest。
        # 构建能力完整保留在 PR 上（这正是它的价值：镜像层的问题要在合并前暴露），
        # 只是不再往注册表写东西。
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -e
          while IFS= read -r tag; do [ -n "$tag" ] && docker push "$tag"; done <<< "${{ steps.meta.outputs.tags }}"
  deploy-secrets:
    name: Deploy Secret Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 独立 job：不依赖构建产物，判定的对象是仓库里的部署清单本身。
    # 存在的理由：values.yaml / deploy/k8s/secret.yaml 里的 REPLACE_WITH_* 占位串
    # 长度达标，能原样通过后端既有的「jwt secret ≥32 字节」强度校验——忘替换的那次
    # 部署不是报错，而是安静地把仓库里公开的字符串当 HMAC-SHA256 密钥上岗，
    # 任何读过本仓库的人都能自造任意租户/ADMIN 的 JWT。
    # 脚本三个方向都断言（默认值必须被拒 / 真实值必须渲染成功 / 结果无残留），
    # 且 helm 不存在时直接 exit 1——跳过不等于通过。
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        # 固定到发布 tag v4.3.1（commit 1a275c3b69536ee54be43f208112b4e1c0d1b3c5）；
        # 与 trivy-action 同口径：不用浮动 major ref，避免上游改动悄悄改变本门禁行为。
        with:
          version: v3.14.4
      - name: 占位凭据门禁校验
        run: bash scripts/check-deploy-secrets.sh
