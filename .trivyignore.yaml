# Trivy 忽略清单（CI security-scan 通过 trivy-action 的 `trivyignores` 入参显式传入）。
#
# **为什么这不是"把扫描关掉"**
# 每条都必须带：① `paths` 限定到具体清单文件（不写 paths = 对全仓所有文件生效）；
# ② `expired_at`（v0.70.0 源码 pkg/result/ignore.go:131-141 `Prune`：过期条目被剔除，
#    发现自动回来判红——到期变红是设计目标，不是故障）；③ `statement` 写可达性证据。
# 前提还由 `XsltViewReachabilityTest` 机器复核：将来有人加 XSLT 视图解析器或 `/**`
# 视图映射，那条测试先红，逼着撤销本条目。
#
# 语义口径以**固定版本 v0.70.0 的源码**为准（trivy.dev 的字段说明与实际解析可能不同步；
# 本仓跑的是 trivy-action@v0.36.0 内置的 trivy v0.70.0）。
vulnerabilities:
  - id: CVE-2026-47884
    paths:
      - pom.xml
      - cloud-backend/pom.xml
    expired_at: "2027-01-31T00:00:00Z"
    statement: >-
      GHSA-pc63-qcmh-9cmg（CRITICAL，由 spring-boot-dependencies 3.5.16 管理的
      org.springframework:spring-webmvc:6.2.19 落入 ">= 6.2.0, <= 6.2.19"）。
      上游 6.x 线**没有修复版**（gh api advisories/GHSA-pc63-qcmh-9cmg 显示所有 6.x
      区间 first_patched_version=null，唯一 fixed 是 7.0.9，需 Boot 3.5→4.x /
      Framework 6.2→7.0 大版本迁移），故本条是**风险登记**而非"已修复"。
      可达性证据（2026-10-06 本机实测，见 XsltViewReachabilityTest）：advisory 的触发前提是
      "存在导向视图渲染的 /** 映射 + 视图名未转义 + 使用 XsltView"；本后端为纯 REST，
      Spring 上下文里 4 个 ViewResolver 全非 Xslt（BeanName/Composite/InternalResource/
      ContentNegotiating），360 个 handler 映射中 /** 模式 0 个。
      撤销条件（任一成立即删除本条）：① spring-webmvc 升到 6.2.x 修复版或 7.x；
      ② 仓内引入任何 XSLT 视图解析或 /** 视图映射；③ 到期。
