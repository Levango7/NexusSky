# Linux 专用编排（D4 修正版）：
# - MAVLink UDP 发现/路由依赖同网段广播语义 -> 全员 host 网络（Windows/Mac
#   Docker Desktop 的 host 支持不完整，直接跑 start-all.cmd / .sh 更简单）
# - host 模式下 ports: 映射无效且误导，已移除；端口即进程真实监听端口
# - 前置：先 mvn -DskipTests package（三个模块 jar 挂载进容器）
# - 2026-10-26：补 postgres + 后端环境变量——此前本文件**从未被 compose up 实测过**，
#   裸跑 = prod profile 打 localhost:5432（没有库）+ 空 jwt-secret ⇒ 必崩
#   （GAPS §二「docker-compose 完整性验证」；compose-smoke CI job 由此而来）。
services:
  # ===== PostgreSQL：后端 prod profile 硬依赖（Flyway V1..V29 在此跑） =====
  postgres:
    image: postgres:15-alpine
    network_mode: host          # 后端默认打 localhost:5432，host 网络直通
    environment:
      - POSTGRES_DB=aerofleet_prod
      - POSTGRES_USER=aerofleet
      - POSTGRES_PASSWORD=aerofleet_dev_password
    restart: unless-stopped

  drone-sim:
    image: eclipse-temurin:17-jre
    # jar 挂在 /app，而官方镜像 WORKDIR=/：不设 working_dir 时相对 jar 名会解析成
    # /aerofleet-drone-sim-….jar → "Unable to access jarfile" 秒退。
    # 判定面是 docker ps 的 Up 与 docker logs，不是 compose 的 Started 回显。
    working_dir: /app
    volumes:
      - ./drone-sim/target:/app
    command: java -jar aerofleet-drone-sim-0.1.0-SNAPSHOT-shaded.jar --port 14540
    network_mode: host

  cloud-backend:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - ./cloud-backend/target:/app
    command: java -jar aerofleet-cloud-backend-0.1.0-SNAPSHOT.jar
    network_mode: host
    environment:
      # base application.properties:5 默认 spring.profiles.active=prod ⇒ 以下 5 项在 prod
      # 全部无缺省，缺一即启动失败（jwt-secret / users / encryption.key 是显式 fail-fast，
      # datasource password 无默认）。本地编排给显式开发值，生产部署必须覆盖。
      # AEROFLEET_* 环境变量经 Spring 宽松绑定映射 aerofleet.security.* / aerofleet.encryption.*
      - AEROFLEET_SECURITY_JWT_SECRET=compose-dev-secret-0123456789abcdef0123456789abcdef
      - AEROFLEET_JWT_SECRET=compose-dev-secret-0123456789abcdef0123456789abcdef
      - "AEROFLEET_USERS=admin:compose-dev-password:ADMIN"
      - AEROFLEET_ENCRYPTION_KEY=compose-dev-encryption-key-0123456789abcdef
      # 与上面 postgres 服务的 POSTGRES_PASSWORD 对齐（prod profile 打 localhost:5432）
      - SPRING_DATASOURCE_PASSWORD=aerofleet_dev_password
    depends_on:
      - postgres
      - drone-sim

  gcs-web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./gcs-web:/app
    # 骨架阶段用 dev server（vite 代理 /api /ws 到同 host 的 8080）；
    # 生产化时应改为多阶段构建产物 + 静态托管，见 README「docker-compose 边界」
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    network_mode: host
    depends_on:
      - cloud-backend
